---
# yamllint disable rule:line-length
# The exclude regex and the actionlint entry are single unsplittable
# strings; wrapping either changes what they match.
# Local pre-commit gates for nginx-autocert-module.
#
# GENERATED by tools/gen-precommit-config.py -- re-run it rather than
# hand-editing paths, so every module's config stays derived from its real
# layout instead of drifting toward a copied-around guess.
#
# Purpose: catch the cheap half of what CI catches, before a push burns a
# remote round-trip. These hooks mirror the CI gates in .github/workflows/
# (flawfinder >=4, semgrep >=WARNING, cppcheck, ruff). If a threshold moves
# there, move it here in the same commit, or local-green stops predicting
# remote-green.
#
# The mirror is EXACT and was not always: flawfinder and
# semgrep gated here while their four CI sites piped to `tee` with no
# --error-level and an explicit `|| true`, so a finding blocked a local commit
# and then sailed through CI. The fix went in the direction that KEEPS
# coverage -- CI was gated up to these thresholds, not these relaxed down to
# CI. If you find them diverged again, fix CI first.
#
# Detected in this repo:
#   C source dirs : src
#   Python dirs   : (none)
#   fuzz corpora  : ci/fuzz/corpus, ci/fuzz/corpus_http
#
# What is NOT here, and why:
#   clang-tidy   -- needs ngx_auto_config.h, which only exists after nginx is
#                   configured. A hook cannot assume a built tree, and one that
#                   silently skips when the tree is missing is a vacuous gate.
#                   Stays CI-only on purpose. NOTE this reason does NOT extend
#                   to cppcheck, which parses standalone and IS gated below.
#   clang-format -- no .clang-format in these repos, so there is no agreed style
#                   to enforce; adding one would reformat existing code in an
#                   unrelated diff.
#   codeql/asan/valgrind/fuzzing -- far too slow for a commit hook; CI-only.
#
# Fuzz harnesses (ci/fuzz/, t/) are outside the lint scope: they deliberately do
# unsafe things with untrusted input and would trip flawfinder forever.
#
# Install (once per clone):
#   pipx install pre-commit && pre-commit install
#
# This repo has no tracked .githooks/pre-commit, so .git/hooks/ is what git
# reads. If you later adopt the tracked-hook design, `git config core.hooksPath
# .githooks` makes this config unreachable unless that hook calls
# `pre-commit run --hook-stage pre-commit` itself -- core.hooksPath REPLACES
# .git/hooks/, it does not add to it.
#
# Run against everything without committing:
#   pre-commit run --all-files
#
# VERIFY BEFORE TRUSTING (a green hook proves nothing until seen red):
#   printf '#!/bin/bash\ncd /tmp/x\nrm -rf "${B}/"*\n' > _p.sh
#   pre-commit run shellcheck --files _p.sh     # expect Failed
#   rm _p.sh
# Note SC2086 is INFO and correctly does NOT trip shellcheck here -- probe with
# a real warning-severity finding (SC2164/SC2115) or you will misread the gate.

# Fuzz corpus files are byte-exact test inputs: a stripped space or an added
# newline changes what is actually fuzzed. Never let a fixer touch them.
#
# .pem and .der are NOT in this list, deliberately. pre-commit applies the
# top-level exclude before any per-hook rule, so a suffix named here is
# invisible to EVERY hook -- including detect-private-key, whose entire job is
# catching a .pem. Verified: an identical fake key reads "(no files to check)
# Skipped" as probe.pem and "Private key found" as probe.txt. They are excluded
# per-hook on the three fixers below instead, which is the only reason they were
# ever in this list.
exclude: '^ci/fuzz/corpus/|^ci/fuzz/corpus_http/|\.traefik-ref/|\.claude/worktrees/|\.build/|(^|/)objs/|(^|/)vendor/|(^|/)node_modules/|(^|/)\.venv/|\.(bin|gz|zip|png|ico|so|o|a)$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The three fixers rewrite files in place, which is why keys and DER blobs
      # have to stay out of their reach. Per-hook, not top-level: a top-level
      # exclude would also blind detect-private-key below.
      - id: trailing-whitespace
        exclude: '\.(pem|der)$'
      - id: end-of-file-fixer
        exclude: '\.(pem|der)$'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(pem|der)$'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
      # Test vectors are not secrets. A derived module's unit tests can carry
      # locked PEM fixtures (an elided MIGH... blob, a documented P-256
      # vector); gating on those is a pure false positive, while the hook still
      # guards every real path.
      - id: detect-private-key
        exclude: '^(ci/)?tests?/'

  - repo: local
    hooks:
      # Mirrors the CI "gitleaks" step. Different scope on purpose: a commit
      # hook can only see what is being committed, so it scans the staged
      # patch, while CI scans the whole history -- a secret that was committed
      # and later removed is still published, and only the history scan finds
      # it. Measured at zero findings before the gate went in.
      #
      # detect-private-key above is not a substitute: it matches PEM key
      # headers only, and misses every token-shaped secret (PATs, bot tokens,
      # cloud keys), which is what actually leaks out of these repos.
      #
      # VERIFY WITH A NON-EXAMPLE SECRET. The obvious probe -- AWS's own
      # AKIAIOSFODNN7EXAMPLE / wJalrXUtnFEMI... pair -- is allowlisted by the
      # default ruleset and reports "no leaks found", which reads exactly like
      # a broken gate. Probe with a plausible token instead:
      # Build the probe token from parts -- a literal one written out here is
      # itself a leak by this hook's own rules, and would land the gate red on
      # its own config file:
      #   T=xoxb-2024827913265; T="$T-2024891053289-fJk2mQ8vNwLpXcRt7HzYbA31"
      #   printf 'k = "%s"\n' "$T" > p.txt
      #   git add p.txt && gitleaks git --staged --no-banner --redact -v
      #   git reset -q p.txt && rm p.txt        # expect: leaks found: 1
      - id: gitleaks
        name: gitleaks (staged patch)
        entry: gitleaks git --staged --no-banner --redact
        language: system
        pass_filenames: false
        always_run: true

      # Mirrors the CI "flawfinder (gate on >=4)" step: fires on exactly what
      # CI blocks on. Noise below level 4 would train everyone to --no-verify.
      - id: flawfinder
        name: flawfinder (gate on >=4)
        entry: flawfinder --minlevel=4 --error-level=4 --quiet
        language: system
        files: '^src/.*\.[ch]$'
        pass_filenames: true

      # Mirrors the CI "semgrep (gate on >=WARNING)" step, same configs and
      # same severity floor. WARNING not ERROR: the registry's ERROR tier has
      # no C rules that fire on this kind of code, so an ERROR gate could never
      # go red (verified 2026-07-30).
      #
      # require_serial IS LOAD-BEARING, do not remove it to "speed the hook up":
      # pre-commit otherwise shards the file list across one process per core
      # (32 here), and every semgrep-core allocates its own io_uring. That blows
      # past RLIMIT_MEMLOCK (ulimit -l, 8192 KB on this box) and semgrep-core
      # dies with
      #     Unix_error: Cannot allocate memory io_uring_queue_init
      # surfacing as a bare "exit code 2" with no message. That failure is
      # indistinguishable from a real finding at a glance, so it would have
      # this gate permanently red for a reason that has nothing to do with the
      # code. One process, one ring, no contention.
      #
      # --quiet is also deliberately ABSENT: it suppressed exactly the error
      # text above and turned a diagnosable crash into a silent exit 2.
      #
      # --jobs=1 closes the SECOND source of the same crash. require_serial
      # above stops pre-commit forking one hook process per core; it does
      # nothing about semgrep's own internal parallelism, which forks
      # semgrep-core per core inside that single process and allocates an
      # io_uring for each. A target with few enough C files never reaches the
      # limit and looks fine, so this only surfaces as the tree grows -- which
      # is exactly when a green-to-red flip reads as a real finding.
      - id: semgrep
        name: semgrep (gate on >=WARNING)
        entry: semgrep scan --jobs=1 --config p/c --config p/security-audit
               --severity=WARNING --severity=ERROR --error
        language: system
        files: '^src/.*\.[ch]$'
        pass_filenames: true
        require_serial: true

      # Mirrors the CI "Static analysis" step in build-test.yml: same enable
      # set, same suppressions, same -I. Any of those diverging makes local
      # green stop predicting remote green, which is this file's whole job.
      #
      # unusedStructMember is suppressed because cppcheck sees one TU at a
      # time here and cannot know a member is read from another file; -I is
      # the C source dir, so headers next to the sources resolve rather than
      # being reported as missing.
      #
      # -DNGX_PTR_SIZE=8: the breaker probe-word layout selects on this macro
      # and #errors when it is undefined. It normally arrives from nginx's
      # generated objs/ngx_auto_config.h, which cppcheck never sees, so it has
      # to be supplied -- an undefined macro in #if silently evaluates to 0 and
      # would pick the wrong layout for the whole analysis (H-1).
      #
      # Unlike clang-tidy this needs NO configured nginx tree, which is why it
      # can gate here at all.
      # The trailing flags are harvested from this repo's own
      # .github/workflows/build-test.yml cppcheck step, so the "same
      # suppressions as CI" promise above holds by construction instead of by
      # hand. Do not hand-edit them here -- change the workflow and re-run
      # tools/gen-precommit-config.py, or local green stops predicting remote.
      #
      - id: cppcheck
        name: cppcheck (warning,performance,portability)
        entry: cppcheck --enable=warning,performance,portability
               --error-exitcode=1 --suppress=missingIncludeSystem
               --suppress=normalCheckLevelMaxBranches --suppress=unusedFunction
               --suppress=unusedStructMember -I src -DNGX_PTR_SIZE=8 -DOPENSSL_VERSION_NUMBER=0x30000000L --suppress=intToPointerCast
        language: system
        files: '^src/.*\.[ch]$'
        pass_filenames: true

      # CI workflows are code that breaks silently; actionlint catches bad if:
      # expressions, unknown contexts and shell errors inside run: blocks.
      #
      # -config-file: declares this repo's self-hosted runner labels explicitly
      # rather than relying on actionlint finding .github/actionlint.yaml by
      # cwd-guessing -- pre-commit hooks do not guarantee cwd the way a bare
      # `actionlint` invocation from a shell does.
      #
      # SHELLCHECK_OPTS applies to the shellcheck actionlint runs over `run:`
      # blocks. Without it that embedded pass reports at INFO while the
      # standalone shellcheck hook below gates at warning -- so the same SC2086
      # would be ignored in a .sh file and blocking in a workflow. Same floor
      # in both places.
      - id: actionlint
        name: actionlint (workflow syntax)
        entry: env SHELLCHECK_OPTS=-Swarning actionlint -config-file .github/actionlint.yaml
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true

      # -S warning: block on warning/error, not info. The info tier (e.g.
      # SC2015) fires on existing scripts and would land this red on arrival,
      # which just teaches everyone to --no-verify.
      #
      # NOTE some repos have pre-existing warning-level findings in build/test
      # scripts (SC2043 in a unit-test helper, SC2010 in a fuzz build script,
      # SC2089/2090 in a package build script, all seen in derived modules).
      # They do NOT block normal work, because a commit hook only ever sees the
      # files being committed -- they surface on `pre-commit run --all-files`.
      # They are real and worth fixing; they are deliberately NOT suppressed
      # here, so touching one of those scripts makes you fix it.
      - id: shellcheck
        name: shellcheck (gate on >=warning)
        entry: shellcheck -S warning
        language: system
        files: \.(sh|bash)$
        pass_filenames: true
