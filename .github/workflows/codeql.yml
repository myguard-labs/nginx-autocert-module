# sync-sha: 7f279f6d4720ec12cdb8b3aa3eea025b97ba2a41d919586c75999c7c3c14c04d
name: CodeQL

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master]
  # No pull_request: — ci.yml is the sole PR entry point and calls this
  # workflow. push: and the monthly schedule below are unaffected.
  schedule:
    # Monthly, day 2 @ 04:47 UTC (staggered per repo like ci-deep).
    - cron: "47 4 2 * *"
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  # github.workflow is part of the group deliberately: this workflow is also
  # called from ci.yml, and a called workflow inherits the CALLER's
  # github.workflow/github.ref. Without that component the standalone run and
  # the called run compute an identical group string and cancel each other —
  # observed on run 31277899356, cancelled one second after it started.
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # Upload CodeQL SARIF to the Security tab.
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # CodeQL must trace real compiler invocations. A restored ccache can
      # satisfy every module object without letting the extractor see C/C++.
      - name: Install build dependencies
        uses: ./.github/actions/setup  # zizmor: ignore[self-repository] actionlint rejects $/ (actionlint#711)
        with:
          packages: >-
            build-essential curl libpcre2-dev libssl-dev zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: c-cpp
          queries: security-extended
          config: |
            paths:
              - src
            paths-ignore:
              - nginx-*/**

      - name: Build traced modules
        run: bash ci/tools/ci-build.sh codeql modules

      - name: Verify module built
        run: test -f "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/ngx_http_autocert_module.so"

      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:c-cpp
          output: sarif-results

      # analyze@v4 always uploads to the Security tab and always exits 0 --
      # it has no gate of its own, so an error-level finding merged silently
      # for as long as this workflow existed. Fail the job here on any SARIF
      # result whose rule carries security-severity or problem.severity
      # "error" (CodeQL's own error tier, as opposed to warning/note/
      # recommendation), so a real defect blocks the branch instead of only
      # showing up as a Security-tab alert someone has to remember to check.
      - name: Fail on error-level CodeQL findings
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no SARIF output found under sarif-results/ -- analyze step did not run or output: path changed"
            exit 1
          fi
          count=0
          for f in "${files[@]}"; do
            n="$(jq '[.runs[]
                       | . as $run
                       | .results[]
                       | (.level // ($run.tool.driver.rules[.ruleIndex].defaultConfiguration.level // "warning"))
                       | select(. == "error")] | length' "$f")"
            count=$((count + n))
          done
          echo "error-level CodeQL findings: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::$count error-level CodeQL finding(s) -- see the Security tab for /language:c-cpp"
            exit 1
          fi
