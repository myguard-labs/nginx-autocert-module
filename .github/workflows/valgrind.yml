# sync-sha: 4c3bea85b4a9274a01a9ec3d21c690772126ca888a565da652a8d1437e703fe2
name: Valgrind

# Manual Valgrind memcheck lite soak — 30s soak of the HTTP-01 serve path, no
# helgrind. PR/release coverage lives in ci-deep.yml so normal pushes do not
# steal self-hosted runner lanes from Build & Test.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  workflow_dispatch: {}

concurrency:
  group: valgrind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Short memcheck soak — 30s, no helgrind (helgrind = deep only) ─────────
  memcheck-lite:
    name: Memcheck lite (30s soak)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 45
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup build deps + ccache
        uses: ./.github/actions/setup  # zizmor: ignore[self-repository] actionlint rejects $/ (actionlint#711)
        with:
          packages: >-
            build-essential ccache curl libpcre2-dev libssl-dev pkg-config
            valgrind wget zlib1g-dev
          ccache-key: valgrind

      - name: Build debug nginx + autocert module (dynamic, AUTOCERT_TEST=1)
        run: bash ci/tools/ci-build.sh valgrind

      - name: Memcheck soak (30s)
        env:
          USE_VALGRIND: "1"
          NGX_BUILD_DIR: ${{ github.workspace }}/nginx-${{ env.NGINX_VERSION }}
        run: |
          bash ci/tools/soak.sh \
            "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/nginx" 30 4
