# sync-sha: 173470ccffe05a330da922db27c0130a16398ff6a5e34782fb80be0bccba6143
name: CI Deep

# Exhaustive dynamic analysis — monthly cron, release, and on-demand only,
# NEVER on PR. Normal PR/push CI stays on Build & Test; this workflow is the
# fuzz + Valgrind release/deep gate.
# codeql.yml is dropped entirely: CodeQL / the GitHub Security tab is
# GitHub-Advanced-Security only and does nothing on a private repo, so the
# SARIF-upload path is removed too — the scanners still run and GATE on
# findings, they just don't upload.
#
# Jobs: fuzz (14400s/target) · memcheck soak · helgrind soak · scanners ·
#       e2e-angie (the Pebble suite on angie).
#   * e2e-angie moved here out of build-test.yml: at ~11.5 minutes it was the
#     per-PR wall-clock, while covering the same module logic as the nginx leg
#     that still runs on every PR. build-test.yml keeps build-angie, so an angie
#     compile/load break is still caught pre-merge; only the Pebble issuance/
#     renewal run is deferred to this monthly/on-demand workflow.
#   * memcheck AND helgrind both run ci/tools/soak.sh, which passes
#     --suppressions=ci/tools/valgrind.supp and (helgrind) --error-exitcode=99 —
#     the drift-fix baseline for every module.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  release:
    types: [published]
  schedule:
    # Monthly, day 2 @ 03:30 UTC — staggered per repo so ci-deep runs
    # don't pile up on the shared self-hosted runners.
    - cron: "30 3 2 * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Per-target fuzz duration (seconds)"
        required: false
        default: "3600"

concurrency:
  group: ci-deep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (JSON + HTTP + base64url, long)
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 600
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Select fuzz duration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "FUZZ_SECS=${{ github.event.inputs.fuzz_seconds }}" >> "$GITHUB_ENV"
          else
            echo "FUZZ_SECS=3600" >> "$GITHUB_ENV"
          fi

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh

      - name: Fuzz each target
        run: |
          set -euo pipefail
          cd ci/fuzz
          for t in json:corpus http:corpus_http b64:corpus_b64; do
            name=${t%%:*}; corp=${t##*:}
            echo "== fuzz_${name} (${FUZZ_SECS}s) =="
            set +e
            "./fuzz_${name}" \
              -max_total_time="$FUZZ_SECS" \
              -dict=fuzz.dict \
              -print_final_stats=1 \
              -artifact_prefix="crash-${name}-" \
              "${corp}/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ fuzz_${name} crash (exit $rc)"; exit 1; }
            echo "✓ no crashes in fuzz_${name} ${FUZZ_SECS}s"
            # Minimize + persist so the run stays compact.
            mkdir -p "${corp}-min"
            "./fuzz_${name}" -merge=1 "${corp}-min/" "${corp}/"
            echo "merged fuzz_${name}: $(find "${corp}-min" -type f | wc -l) units"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-deep-crashes
          path: ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 30

      - name: Upload minimized corpus
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-corpus
          path: |
            ${{ github.workspace }}/ci/fuzz/corpus-min
            ${{ github.workspace }}/ci/fuzz/corpus_http-min
            ${{ github.workspace }}/ci/fuzz/corpus_b64-min
          retention-days: 30

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${{ github.repository }} — CI Deep / fuzz FAILED. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

  memcheck:
    name: Valgrind Memcheck soak
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 240
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev libssl-dev pkg-config \
            valgrind wget zlib1g-dev
      - name: Build debug nginx + autocert module (dynamic, AUTOCERT_TEST=1)
        run: bash ci/tools/ci-build.sh valgrind
      - name: Memcheck soak (600s @ 4 conc, WITH suppressions)
        env:
          USE_VALGRIND: "1"
          NGX_BUILD_DIR: ${{ github.workspace }}/nginx-${{ env.NGINX_VERSION }}
        run: |
          bash ci/tools/soak.sh \
            "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/nginx" 600 4
      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${{ github.repository }} — CI Deep / memcheck FAILED. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

  helgrind:
    name: Valgrind Helgrind soak
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 240
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev libssl-dev pkg-config \
            valgrind wget zlib1g-dev
      - name: Build debug nginx + autocert module (dynamic, AUTOCERT_TEST=1)
        run: bash ci/tools/ci-build.sh valgrind
      - name: Helgrind soak (600s @ 4 conc, --error-exitcode=99, WITH suppressions)
        env:
          USE_HELGRIND: "1"
          NGX_BUILD_DIR: ${{ github.workspace }}/nginx-${{ env.NGINX_VERSION }}
        run: |
          bash ci/tools/soak.sh \
            "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/nginx" 600 4
      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${{ github.repository }} — CI Deep / helgrind FAILED. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

  scanners:
    name: Security scanners
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flawfinder clang-tidy python3 python3-pip pipx nginx-dev libssl-dev
          # semgrep: isolate via pipx (PEP 668 blocks a bare pip3 install into the
          # system Python on the Ubuntu 24.04 self-hosted runner). Fall back to a
          # user pip install with --break-system-packages if pipx is unavailable.
          if command -v pipx >/dev/null; then
            pipx install --quiet semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Configure nginx src tree (clang-tidy headers)
        run: |
          set -euo pipefail
          bash ci/tools/ci-build.sh debug none >/dev/null
          # ci-build.sh appends NGINX_VERSION to $GITHUB_ENV, which only takes
          # effect in a LATER step -- source it here so this step can use it too.
          # shellcheck disable=SC1090
          source "$GITHUB_ENV"
          echo "NGINX_SRC_TREE=$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}" >> "$GITHUB_ENV"
      - name: flawfinder
        run: |
          flawfinder --minlevel=1 "$GITHUB_WORKSPACE/src/" 2>&1 | tee flawfinder.log
      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          N="$NGINX_SRC_TREE"
          INCLUDES="-I$N/src/core -I$N/src/event -I$N/src/event/modules -I$N/src/event/quic \
            -I$N/src/os/unix -I$N/objs -I$N/src/http -I$N/src/http/modules -I$N/src/http/v2 \
            -I$GITHUB_WORKSPACE/src -I/usr/include"
          status=0
          for f in \
            "$GITHUB_WORKSPACE/src/ngx_autocert_json.c" \
            "$GITHUB_WORKSPACE/src/ngx_autocert_acme.c" \
            "$GITHUB_WORKSPACE/src/ngx_autocert_challenge.c"; do
            # shellcheck disable=SC2086
            clang-tidy "$f" \
              --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
              --warnings-as-errors='*' \
              -- $INCLUDES 2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"
      - name: semgrep
        run: |
          semgrep scan --config p/c --config p/security-audit \
            "$GITHUB_WORKSPACE/src/" 2>&1 | tee semgrep.log || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14

  # ------------------------------------------------------------------ angie e2e
  # The full Pebble issuance/renewal suite against angie. Lives here rather than
  # in build-test.yml because it costs ~11.5 minutes and duplicates the module
  # coverage of the nginx leg that still gates every PR; build-test.yml keeps
  # build-angie, so an angie compile/load/USR2 break is caught pre-merge.
  #
  # Self-contained (no cross-workflow artifact): it resolves the latest angie,
  # builds the module against it with the same composite action build-test uses,
  # then runs ci/tests/e2e/run-all.sh against the freshly built tree.
  e2e-angie:
    name: e2e suite (Pebble) [angie]
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 60
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Pinned, not a live lookup -- same reason as build-test.yml's `resolve`:
      # .github/versions.env is the single source, bump.yml moves it weekly.
      - name: Read pinned angie version
        id: v
        run: |
          set -euo pipefail
          f=.github/versions.env
          [ -f "$f" ] || { echo "::error::$f not found"; exit 1; }
          # shellcheck disable=SC1090
          . "$f"
          for k in ANGIE_VERSION ANGIE_SHA256; do
            eval "v=\${$k:-}"
            [ -n "$v" ] || { echo "::error::$k missing from $f"; exit 1; }
          done
          echo "Pinned angie: $ANGIE_VERSION"
          {
            echo "angie_version=$ANGIE_VERSION"
            echo "angie_dir=angie-$ANGIE_VERSION"
            echo "angie_url=https://download.angie.software/files/angie-$ANGIE_VERSION.tar.gz"
            echo "angie_sha256=$ANGIE_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Build module + load/serve tests
        uses: ./.github/actions/build-module
        with:
          flavor: angie
          version: ${{ steps.v.outputs.angie_version }}
          url: ${{ steps.v.outputs.angie_url }}
          dir: ${{ steps.v.outputs.angie_dir }}
          sha256: ${{ steps.v.outputs.angie_sha256 }}

      - name: Install python cryptography for the mock CAs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-cryptography

      - name: Run the full e2e suite against angie
        run: |
          set -uo pipefail
          NGX="$GITHUB_WORKSPACE/${{ steps.v.outputs.angie_dir }}"
          BIN="$NGX/objs/angie"
          [ -f "$BIN" ] || BIN="$NGX/objs/nginx"
          chmod +x "$BIN"
          # Same port-budget rule as build-test.yml's e2e job: every published
          # host port MUST stay below the ephemeral range, or docker races the
          # kernel's own outbound allocations and fails a RANDOM test with
          # "port is already allocated" (exit 125). Keep run_offset small enough
          # that max(PORT_BASES) + run_offset + 1000 + max_slot*100 < 32768.
          run_offset=$(( (GITHUB_RUN_ID % 6) * 1500 ))
          port_offset=$(( run_offset + 1000 ))
          echo "e2e port offset: run_offset=${run_offset} flavor_offset=1000 port_offset=${port_offset}"

          ephemeral_lo=$(cut -f1 < /proc/sys/net/ipv4/ip_local_port_range)
          max_port=$(AC_PORT_OFFSET="$port_offset" bash ci/tests/e2e/max-port.sh)
          echo "e2e highest published port: ${max_port} (ephemeral floor ${ephemeral_lo})"
          if [ "$max_port" -ge "$ephemeral_lo" ]; then
              echo "::error::e2e port budget blown: highest published port ${max_port}" \
                   ">= ephemeral floor ${ephemeral_lo}; shrink run_offset in ci-deep.yml"
              exit 1
          fi

          SERVER_BIN="$BIN" NGX_BUILD_DIR="$NGX" FLAVOR="angie" AC_PORT_OFFSET="$port_offset" \
            bash ci/tests/e2e/run-all.sh

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${{ github.repository }} — CI Deep / e2e-angie FAILED. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
