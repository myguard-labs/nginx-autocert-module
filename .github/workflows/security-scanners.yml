# sync-sha: b2a7b53e302f26835123adafeef6f9fa7ae8d5f20a164c0eab0f6de25369504a
name: Security scanners

# Static / security scanners gate on every PR/push — flawfinder, clang-tidy
# (cert-*, security.*) and semgrep over src/. Same job as the ci-deep.yml
# scanners job, promoted to a PR gate.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  push:
    branches: [master]
  # No pull_request: — ci.yml is the sole PR entry point and calls this
  # workflow. push: is kept so master still gets direct coverage.
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: security-scanners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scanners:
    name: Security scanners
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Setup scanner deps + ccache
        uses: ./.github/actions/setup  # zizmor: ignore[self-repository] actionlint rejects $/ (actionlint#711)
        with:
          packages: >-
            build-essential ccache clang-tidy flawfinder libpcre2-dev libssl-dev
            nginx-dev pipx python3 python3-pip zlib1g-dev
          ccache-key: security-scanners
      - name: Install semgrep
        run: |
          # semgrep: isolate via pipx (PEP 668 blocks a bare pip3 install into the
          # system Python on the Ubuntu 24.04 self-hosted runner). Fall back to a
          # user pip install with --break-system-packages if pipx is unavailable.
          if command -v pipx >/dev/null; then
            pipx install --quiet semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages semgrep
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Configure nginx src tree (clang-tidy headers)
        run: |
          set -euo pipefail
          bash ci/tools/ci-build.sh debug none >/dev/null
          # ci-build.sh appends NGINX_VERSION to $GITHUB_ENV, which only takes
          # effect in a LATER step -- source it here so this step can use it too.
          # shellcheck disable=SC1090
          source "$GITHUB_ENV"
          echo "NGINX_SRC_TREE=$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}" >> "$GITHUB_ENV"
      - name: flawfinder
        run: |
          set -u
          # --minlevel=1 so the log keeps the low-severity hits for the uploaded
          # report, --error-level=4 so only level >= 4 fails the job. Same floor
          # as the local .pre-commit-config.yaml hook; if the two drift, local
          # green stops predicting remote green.
          #
          # The status comes from PIPESTATUS[0], not the pipeline: piping into
          # tee makes tee's exit status the pipeline's, which silently discarded
          # flawfinder's for as long as this step has existed. `set -o pipefail`
          # alone would not do either: the log must still be written for the
          # "Upload reports" step when the tool fails.
          flawfinder --minlevel=1 --error-level=4 \
            "$GITHUB_WORKSPACE/src/" 2>&1 | tee flawfinder.log
          exit "${PIPESTATUS[0]}"
      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          N="$NGINX_SRC_TREE"
          INCLUDES="-I$N/src/core -I$N/src/event -I$N/src/event/modules -I$N/src/event/quic \
            -I$N/src/os/unix -I$N/objs -I$N/src/http -I$N/src/http/modules -I$N/src/http/v2 \
            -I$GITHUB_WORKSPACE/src -I/usr/include"
          status=0
          # All 12 translation units under src/ -- was hardcoded to 3 files
          # (ngx_autocert_json.c, ngx_autocert_acme.c, ngx_autocert_challenge.c),
          # leaving 9 with no clang-tidy coverage at all. Verified locally
          # (clang-tidy 19.1.7, this check set) clean on all 12 against a
          # properly configured tree (--with-http_ssl_module, so NGX_OPENSSL
          # is defined and the SSL-touching files parse).
          for f in "$GITHUB_WORKSPACE"/src/*.c; do
            # shellcheck disable=SC2086
            clang-tidy "$f" \
              --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
              --warnings-as-errors='*' \
              -- $INCLUDES 2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"
      - name: semgrep
        run: |
          set -u
          # --severity + --error mirror the local .pre-commit-config.yaml hook:
          # block on WARNING and ERROR, ignore the INFO tier. Previously this
          # step was advisory twice over -- `| tee` handed the pipeline tee's
          # exit status, and a trailing `|| true` discarded even that -- so CI
          # accepted findings the local hook rejects.
          #
          # Status via PIPESTATUS[0] rather than pipefail so semgrep.log is
          # still written for "Upload reports" when the scan fails.
          #
          # --jobs=1: correctness flag (io_uring/RLIMIT_MEMLOCK contention), not
          # speed; see .pre-commit-config.yaml for the full rationale.
          # --metrics=off: skip telemetry POST to semgrep.dev.
          semgrep scan --jobs=1 --metrics=off --config p/c --config p/security-audit \
            --severity=WARNING --severity=ERROR --error \
            "$GITHUB_WORKSPACE/src/" 2>&1 | tee semgrep.log
          exit "${PIPESTATUS[0]}"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14
