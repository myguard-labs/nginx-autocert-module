name: ASan

# Manual ASan+UBSan soak — 30s mixed-load soak of the HTTP-01 serve path with an
# nginx built under -fsanitize=address,undefined. Catches use-after-free / heap
# overflow / lifetime bugs that survive a request and that NGX_DEBUG_PALLOC +
# valgrind (see valgrind.yml) can miss because the request pool is freed whole.
# soak.sh already writes ASan reports to logs/asan* and fails on any report; here
# the sanitizer is compiled into the binary rather than run as an external tool.
#
# PR/release memory-debug coverage lives in ci-deep.yml + valgrind.yml so normal
# pushes do not steal self-hosted runner lanes from Build & Test.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  workflow_dispatch: {}

concurrency:
  group: asan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── ASan+UBSan soak — 30s mixed load, sanitizer compiled into the binary ───
  asan-soak:
    name: ASan+UBSan (30s soak)
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 45
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve latest mainline nginx
        run: |
          set -euo pipefail
          ver=$(curl -fsSL https://nginx.org/en/download.html \
            | grep -oP 'nginx-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.gz)' \
            | sort -V | tail -1)
          [ -n "$ver" ] || { echo "::error::cannot resolve nginx version"; exit 1; }
          echo "NGINX_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev libssl-dev pkg-config \
            wget zlib1g-dev

      - name: Build ASan+UBSan nginx + autocert module (dynamic, AUTOCERT_TEST=1)
        run: |
          set -euo pipefail
          test -f "nginx-${NGINX_VERSION}.tar.gz" || \
            wget -q -O "nginx-${NGINX_VERSION}.tar.gz" \
              "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          tar -xzf "nginx-${NGINX_VERSION}.tar.gz"
          cd "nginx-${NGINX_VERSION}"
          SAN="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g3 -O1"
          AUTOCERT_TEST=1 ./configure \
            --with-compat --with-debug --with-threads --with-http_ssl_module \
            --with-cc-opt="$SAN" \
            --with-ld-opt="-fsanitize=address,undefined" \
            --add-dynamic-module="$GITHUB_WORKSPACE"
          make -j"$(nproc)"

      - name: ASan+UBSan soak (30s)
        env:
          NGX_BUILD_DIR: ${{ github.workspace }}/nginx-${{ env.NGINX_VERSION }}
        run: |
          bash tools/soak.sh \
            "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/nginx" 30 4
