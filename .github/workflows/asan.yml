# sync-sha: 50e59435d141913eb070ea9fec4b00047ec2c752debc496272e623ee070b4a49
name: ASan

# Manual ASan+UBSan soak — 30s mixed-load soak of the HTTP-01 serve path with an
# nginx built under -fsanitize=address,undefined. Catches use-after-free / heap
# overflow / lifetime bugs that survive a request and that NGX_DEBUG_PALLOC +
# valgrind (see valgrind.yml) can miss because the request pool is freed whole.
# soak.sh already writes ASan reports to logs/asan* and fails on any report; here
# the sanitizer is compiled into the binary rather than run as an external tool.
#
# PR/release memory-debug coverage lives in ci-deep.yml + valgrind.yml so normal
# pushes do not steal self-hosted runner lanes from Build & Test.
#
# Cadence: weekly, Sunday 03:45 UTC. Staggered against the two other scheduled
# builder02 jobs so soaks don't pile up on the shared self-hosted pool:
# build-test.yml's Validation tick is daily 03:17 UTC, ci-deep.yml is monthly
# (day 2) 03:30 UTC. Weekly, not daily, because this is a from-scratch mainline
# nginx build + ASan/UBSan compile + 30s soak on a single shared self-hosted
# runner — daily would burn builder02 time disproportionate to the bug class
# it catches (long-lived lifetime/UAF bugs, not per-commit regressions).
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  workflow_dispatch: {}
  schedule:
    - cron: '45 3 * * 0'

concurrency:
  group: asan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── ASan+UBSan soak — 30s mixed load, sanitizer compiled into the binary ───
  asan-soak:
    name: ASan+UBSan (30s soak)
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 45
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl libpcre2-dev libssl-dev pkg-config \
            wget zlib1g-dev

      - name: Build ASan+UBSan nginx + autocert module (dynamic, AUTOCERT_TEST=1)
        run: bash ci/tools/ci-build.sh asan

      - name: ASan+UBSan soak (30s)
        env:
          NGX_BUILD_DIR: ${{ github.workspace }}/nginx-${{ env.NGINX_VERSION }}
          AC_SOAK_LOG_DIR: ${{ github.workspace }}/soak-logs
        run: |
          bash ci/tools/soak.sh \
            "$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/nginx" 30 4

      # if: always() — the whole point is to capture the logs of a FAILED soak.
      - name: Upload soak logs (sanitizer reports, error.log)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: asan-soak-logs
          path: soak-logs/
          if-no-files-found: warn
          retention-days: 14
