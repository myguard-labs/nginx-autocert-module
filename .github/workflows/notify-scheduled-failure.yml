# sync-sha: c0334213c6f9708c9e6729810d25a856193189d47dfaa9542c32ebcdfa8791cd
name: Notify scheduled job failure

# Split out of build-test.yml (PR #285): a job inside a workflow_call member
# can never hold MORE permission than the caller grants it (ci.yml calls
# build-test.yml with `permissions: contents: read` only), so `issues: write`
# on a job living inside build-test.yml made every ci.yml run fail at
# startup — actionlint does not check this, and it passed locally both
# times. Moving the notifier to its own workflow_run-triggered workflow keeps
# build-test.yml's token untouched (still just `contents: read`, for every PR
# and push job in it) and gives this one job its own `issues: write` with no
# blast radius on the build workflow.
#
# workflow_run instead of a duplicate schedule: trigger: firing on
# build-test.yml's OWN schedule tick would need this workflow to re-derive
# build-test.yml's cron and would drift the moment that cron changes: this
# fires off the actual completion of the run that mattered, whatever
# triggered it, and the `if:` below narrows to schedule-only.
#
# needs.*.result is NOT available under workflow_run (there is no `needs:`
# graph — this workflow doesn't run those jobs), so per-job results are
# queried from the Actions API instead, which needs only `actions: read`.

# workflow_run is flagged by zizmor's dangerous-triggers audit because it is
# commonly paired with checking out and executing the triggering ref's code
# under elevated permissions (pwn-request). This workflow never checks out
# any ref and never runs code from the triggering commit -- it only reads
# github.event.workflow_run.* metadata (id, name, head_sha, event,
# conclusion) and queries the run's job list over the read-only Actions API.
on: # zizmor: ignore[dangerous-triggers] no checkout, no execution of triggering-ref code -- see comment above
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]

concurrency:
  group: notify-scheduled-failure-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify-scheduled-failure:
    name: Notify scheduled job failure
    # Only act on a scheduled Build & Test run, and only on genuine failure or
    # timeout. A cancelled run (e.g. superseded by a newer push via
    # build-test.yml's own concurrency group) is not a rot signal and must not
    # open a tracking issue. `success`/`skipped`/`cancelled` all fall through.
    # `timed_out` is treated as a failure: a job hitting its timeout-minutes on
    # the unwatched scheduled lane is exactly the rot this notifier catches.
    if: github.event.workflow_run.event == 'schedule' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    permissions:
      actions: read # read the triggering run's per-job results
      issues: write # open/comment on tracking issue for scheduled failure notification
    steps:
      - name: Create or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ISSUE_LABEL: ci-scheduled-failure
        run: |
          set -euo pipefail

          ISSUE_TITLE="Scheduled CI job failure"
          WORKFLOW_RUN_URL="${GH_SERVER}/${GH_REPO}/actions/runs/${RUN_ID}"

          # Per-job results: needs.*.result does not exist under workflow_run
          # (this workflow never runs validation/resolve-stable/
          # build-nginx-stable itself), so query the triggering run's jobs
          # directly. actions: read is sufficient for this endpoint.
          JOB_RESULTS=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | "\(.name)=\(.conclusion)"] | join(", ")')

          # Ensure the tracking label exists. Creation failing with "already
          # exists" is fine and expected; a transient 5xx or secondary
          # rate-limit is not, and gh label create can't tell us which one
          # happened, so treat the create's own exit status as uninformative
          # and instead CONFIRM the label is actually present afterwards.
          # If it isn't, we still file the issue -- unlabelled, with a note
          # -- rather than going silently red here and filing nothing: a
          # filed-but-unlabelled issue is recoverable (the label can be
          # attached by hand), while a red notifier with no issue at all is
          # exactly the silent-rot condition this workflow exists to catch.
          # The tradeoff is that an unlabelled issue breaks the exact-match
          # dedup lookup below (it only searches issues carrying the label),
          # so a persistent label outage can produce duplicate issues across
          # runs; that is judged preferable to producing none.
          gh label create "$ISSUE_LABEL" \
            --description "Auto-filed by the scheduled CI failure notifier" \
            --color ededed 2>/dev/null || true

          label_ok=false
          if gh label list --json name --jq '.[].name' \
              | grep -qxF "$ISSUE_LABEL"; then
            label_ok=true
          fi

          BODY=$(cat <<EOF
          Scheduled workflow **${WORKFLOW_NAME}** failed (${WORKFLOW_CONCLUSION}).

          - Trigger: schedule
          - Commit: ${RUN_SHA}
          - Job results: ${JOB_RESULTS}
          - Run: ${WORKFLOW_RUN_URL}
          EOF
          )

          if [ "$label_ok" != true ]; then
            BODY="${BODY}

          _Note: the \`${ISSUE_LABEL}\` tracking label could not be verified
          and was not attached to this issue; future runs may not find this
          issue via the label-based dedup lookup and could file a
          duplicate._"
          fi

          existing=""
          if [ "$label_ok" = true ]; then
            # Exact-match the title among open issues carrying the tracking
            # label, rather than trusting `gh issue list --search`. The
            # title is passed as a jq variable, not spliced into the jq
            # program, so a future title containing a quote/backslash/$
            # cannot break the jq parse.
            existing=$(gh issue list --label "$ISSUE_LABEL" --state open \
              --json number,title \
              | jq -r --arg t "$ISSUE_TITLE" \
                  '.[] | select(.title == $t) | .number' | head -1)
          fi

          if [ -n "$existing" ]; then
            # Comment on the existing issue instead of creating a new one
            gh issue comment "$existing" --body "$BODY"
          elif [ "$label_ok" = true ]; then
            gh issue create \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body "$BODY"
          else
            # Label unusable: file unlabelled rather than fail the job.
            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$BODY"
          fi
