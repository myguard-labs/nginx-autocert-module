name: Helgrind

# Action pins:
# actions/checkout@v5 -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/cache@v4    -> 0057852bfaa89a56745cba8c7296529d2fc39830

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  schedule:
    # Monthly, 1st @ 04:30 UTC.
    - cron: "30 4 1 * *"
  workflow_dispatch: {}

concurrency:
  group: helgrind-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helgrind:
    name: Helgrind
    runs-on: [self-hosted, builder02, lxc]
    # Long monthly helgrind soak on self-hosted — no GitHub 6h cap.
    timeout-minutes: 240
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve latest mainline nginx
        run: |
          set -euo pipefail
          ver=$(curl -fsSL https://nginx.org/en/download.html \
            | grep -oP 'nginx-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.gz)' \
            | sort -V | tail -1)
          if [ -z "$ver" ]; then
            echo "::error::could not resolve mainline nginx version"
            exit 1
          fi
          echo "Resolved nginx mainline: $ver"
          echo "NGINX_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Setup build deps
        uses: ./.github/actions/setup
        with:
          packages: build-essential ccache curl libpcre2-dev libssl-dev valgrind zlib1g-dev
          ccache-key: helgrind-nginx

      - name: Restore nginx tarball cache
        id: nginx-tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/src-tarballs
          key: src-tarball-nginx-${{ env.NGINX_VERSION }}

      - name: Fetch nginx
        # Do NOT gate on cache-hit: on self-hosted runners actions/cache can
        # report a hit while the path is empty, so always ensure the file is
        # actually present (idempotent — curl only when missing).
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/src-tarballs
          tarball="$HOME/.cache/src-tarballs/nginx-${NGINX_VERSION}.tar.gz"
          if [ ! -s "$tarball" ]; then
            curl -fsSL -o "$tarball" \
              "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          fi

      - name: Extract nginx
        run: |
          set -euo pipefail
          tar -xzf "$HOME/.cache/src-tarballs/nginx-${NGINX_VERSION}.tar.gz"

      - name: Configure + build debug nginx with autocert
        run: |
          set -euo pipefail
          cd "nginx-${NGINX_VERSION}"
          ./configure \
            --with-compat \
            --with-debug \
            --with-http_ssl_module \
            --with-cc="ccache cc" \
            --with-cc-opt="-DNGX_DEBUG_PALLOC=1 -g3 -O0 -fno-omit-frame-pointer -funwind-tables" \
            --add-dynamic-module="$GITHUB_WORKSPACE" > /tmp/conf.log 2>&1 \
            || { tail -40 /tmp/conf.log; exit 1; }
          make -j"$(nproc)" > /tmp/make.log 2>&1 || { tail -40 /tmp/make.log; exit 1; }
          test -x objs/nginx
          test -f objs/ngx_http_autocert_module.so
          ccache -s || true

      - name: Build unit tests
        run: |
          set -euo pipefail
          NGX="$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}"
          INC="-I$NGX/src/core -I$NGX/src/event -I$NGX/src/os/unix -I$NGX/objs"
          OBJS="$NGX/objs/src/core/ngx_palloc.o $NGX/objs/src/core/ngx_string.o \
                $NGX/objs/src/os/unix/ngx_time.o $NGX/objs/src/core/ngx_times.o \
                $NGX/objs/src/os/unix/ngx_alloc.o"
          # INC and OBJS are flag/object lists that must word-split.
          # shellcheck disable=SC2086
          gcc -Wall -Wextra -Werror -g3 -O0 $INC -o test_crypto \
            "$GITHUB_WORKSPACE/tests/unit/test_crypto.c" \
            "$GITHUB_WORKSPACE/src/ngx_http_autocert_crypto.c" \
            $OBJS -lssl -lcrypto
          # shellcheck disable=SC2086
          gcc -Wall -Wextra -Werror -g3 -O0 $INC -o test_json \
            "$GITHUB_WORKSPACE/tests/unit/test_json.c" \
            "$GITHUB_WORKSPACE/src/ngx_autocert_json.c" \
            $OBJS

      - name: Run unit tests under Helgrind
        run: |
          runner="valgrind --tool=helgrind --error-exitcode=99"
          $runner ./test_crypto
          $runner ./test_json

      - name: Load modules under Helgrind
        run: |
          set -euo pipefail
          NGX="$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}"
          PREFIX="$(mktemp -d)"
          mkdir -p "$PREFIX/logs" "$PREFIX/conf"
          cat > "$PREFIX/conf/nginx.conf" <<EOF
          load_module $NGX/objs/ngx_http_autocert_module.so;
          error_log $PREFIX/logs/error.log notice;
          events {}
          http {
              autocert on;
              autocert_contact admin@example.com;
              autocert_ca https://acme-staging-v02.api.letsencrypt.org/directory;
              autocert_renew_before 10d;
              autocert_key_type secp256r1;
              autocert_store_layout secure;
              autocert_store_path $PREFIX/store;
              autocert_challenge tls-alpn-01;
              server {
                  listen 8443 ssl;
                  server_name vg.example.com;
                  autocert on;
              }
          }
          EOF
          valgrind \
            --tool=helgrind \
            --error-exitcode=99 \
            "$NGX/objs/nginx" -t -p "$PREFIX" -c "$PREFIX/conf/nginx.conf"

      - name: Notify Discord on failure
        if: failure() && github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_BUILDS: ${{ secrets.DISCORD_CHANNEL_BUILDS }}
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || exit 0
          curl -fsS -X POST \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_BUILDS/messages" \
            -d "{\"content\":\"🔴 ${{ github.repository }} — ${{ github.workflow }} FAILED (scheduled). ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
