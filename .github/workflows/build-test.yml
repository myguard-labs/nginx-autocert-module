# sync-sha: 94a4e41bbdbf8a09942044a8124c4b2b9cca37d6e290cc95b95771dd904f700e
name: Build & Test

# Third-party actions pinned to commit SHAs for supply-chain safety.
# Pin table (canonical for all workflow files — keep consistent):
# actions/checkout@v5          -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/cache@v4             -> 0057852bfaa89a56745cba8c7296529d2fc39830
# actions/upload-artifact@v5   -> 330a01c490aca151604b8cf639adc76d48f6c5d4
# actions/download-artifact@v5 -> 634f93cb2916e3fdff6788551b99b062d0335ce0
#
# Local composite actions:
#   ./.github/actions/setup         apt deps + optional ccache restore.
#   ./.github/actions/build-module  fetch+build one flavor, run the no-network
#                                   load/serve tests, upload build-<flavor>.
#   ./.github/actions/run-e2e       restore build-nginx + run one e2e script
#                                   Pebble e2e (optionally under sudo).

# Both nginx and angie are PINNED: the `resolve` job reads
# .github/versions.env (version + sha256 on adjacent lines) instead of scraping
# nginx.org/download.angie.software at run time, and every tarball fetch is
# verified against the recorded digest. .github/workflows/bump.yml regenerates
# the file weekly and opens a PR, so moving to a new upstream is a reviewable
# commit rather than something a build picks up on its own.
#   - build-nginx and build-angie both fully build the flavor + the module, run
#     the no-network load/serve/lifecycle/USR2 tests, and upload the tree as
#     build-<flavor>. The unit jobs download build-nginx (the C they test is
#     flavor-independent); the Pebble e2e suite runs against nginx here, and
#     against angie monthly in ci-deep.yml (~7.5min/flavor after the #151 timer
#     shrink, and still the longest PR job). angie ships its own native `acme`
#     directive, but this module's `autocert` directive is independent and
#     coexists with it — so the module is fully supported + tested on angie,
#     not just compiled. (Reverses
#     the earlier compile-only stance, PR #26 — see history.md 2026-06-20.)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master, autolabel]
  # No pull_request: — ci.yml is the sole PR entry point and calls this
  # workflow. push: is kept so master and autolabel still get direct coverage,
  # as does the daily Validation schedule below.
  workflow_dispatch: {}
  workflow_call: {}
  # This CI is otherwise PR-only, so a self-hosted-runner toolchain drift (e.g.
  # a cppcheck upgrade on builder02) goes unnoticed on master until the next
  # innocent PR eats the blame (#144/#145, 2026-08-08: a README-only PR failed
  # the Validation gate because master had been latently red for two weeks).
  # Run just the Validation job daily so drift surfaces same-day against
  # master, not against whichever PR happens to open next. The other jobs
  # (build/unit/e2e matrices) stay PR-only to keep self-hosted runner cost
  # down: `resolve` carries the only `schedule` guard, and every other job
  # transitively `needs:` it, so they all cascade-skip. Validation has no
  # `needs:` and no `if:`, which is what leaves it running on the tick.
  schedule:
    # 03:17 UTC daily — off-peak, staggered vs ci-deep's 03:30 monthly run.
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Fast lint gate (adapted from nginx-error-abuse-module): static-check the C,
  # the shell test harness and the workflows before the build matrix spins up.
  validation:
    name: Validation
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 15
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck shellcheck

      - name: Validate scripts and source
        run: |
          bash -n ci/tests/e2e/*.sh ci/fuzz/*.sh ci/tests/unit/*.sh
          shellcheck ci/tests/e2e/*.sh ci/fuzz/*.sh ci/tests/unit/*.sh \
            ci/tools/sync-stamp.sh
          # Each stamped .github/ file carries a `# sync-sha:` of its own
          # content, so a `--list` diff against nginx-skeleton-module names
          # exactly which copies have drifted. The stamps are only worth
          # reading if they cannot go stale, hence this gate: edit a workflow
          # or a composite action without running ci/tools/sync-stamp.sh and the
          # PR goes red here.
          bash ci/tools/sync-stamp.sh --check
          # Reject literal NUL bytes in tracked C sources: they make git/rg treat
          # the file as binary and silently drop it from source search / review.
          if LC_ALL=C grep -laP '\x00' src/*.c src/*.h; then
            echo "::error::NUL byte in tracked C source (listed above)"; exit 1
          fi
          # intToPointerCast: `(void *) 1` in ngx_autocert_serve.c is a non-null
          # sentinel for SSL_set_ex_data, which stores a void* and never
          # dereferences it -- the value is only ever compared against NULL.
          # The cast is idiomatic OpenSSL and portable in practice, so the
          # portability warning is noise here. Suppressed rather than fixed
          # because the alternative (a file-scope dummy object to take the
          # address of) is more machinery than the warning is worth. The check
          # arrived with a cppcheck upgrade on the self-hosted runners, not with
          # a code change: cppcheck 2.17.1 does not report it, the runners'
          # newer build does, and the line predates this workflow edit.
          #
          # Tell cppcheck the OpenSSL version so it takes the satisfied branch
          # of the >= 3.0.0 floor guard instead of evaluating the intentional
          # `#error` with the macro undefined (cppcheck doesn't parse the system
          # opensslv.h). The real build enforces the same floor at compile time.
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            -DOPENSSL_VERSION_NUMBER=0x30000000L \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=unusedFunction \
            --suppress=intToPointerCast \
            src/*.c
          git diff --check

      - name: Lint workflows
        run: |
          version=1.7.7
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          tarball="actionlint_${version}_linux_amd64.tar.gz"
          # Verify the asset against the checksums published in the same release
          # before executing it, so a tampered download fails closed.
          curl -fsSL -o /tmp/actionlint.tgz "${base}/${tarball}"
          curl -fsSL -o /tmp/actionlint.checksums \
            "${base}/actionlint_${version}_checksums.txt"
          ( cd /tmp && grep " ${tarball}\$" actionlint.checksums \
              | sed 's#'"${tarball}"'#actionlint.tgz#' | sha256sum -c - )
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml

  resolve:
    name: Resolve nginx + angie versions
    # Scheduled runs exist only to catch toolchain drift in `validation`; skip
    # the rest of the matrix here to keep self-hosted runner cost down.
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 5
    outputs:
      nginx_version: ${{ steps.v.outputs.nginx_version }}
      nginx_dir: ${{ steps.v.outputs.nginx_dir }}
      nginx_url: ${{ steps.v.outputs.nginx_url }}
      angie_version: ${{ steps.v.outputs.angie_version }}
      angie_dir: ${{ steps.v.outputs.angie_dir }}
      angie_url: ${{ steps.v.outputs.angie_url }}
      nginx_sha256: ${{ steps.v.outputs.nginx_sha256 }}
      angie_sha256: ${{ steps.v.outputs.angie_sha256 }}
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Pins, not a live lookup. Builds used to track whatever nginx.org and
      # download.angie.software happened to be serving at the moment the job
      # ran, so an upstream release turned a green PR red with no diff, and two
      # jobs in the same run could disagree about the version. The versions
      # live in .github/versions.env with their sha256 on the adjacent line;
      # .github/workflows/bump.yml regenerates both weekly and opens a PR, so
      # moving to a new upstream is a reviewable commit rather than a surprise.
      - name: Read pinned nginx + angie versions
        id: v
        run: |
          set -euo pipefail
          f=.github/versions.env
          [ -f "$f" ] || { echo "::error::$f not found"; exit 1; }
          # shellcheck disable=SC1090
          . "$f"
          for k in NGINX_VERSION NGINX_VERSION_SHA256 ANGIE_VERSION ANGIE_SHA256; do
            eval "v=\${$k:-}"
            [ -n "$v" ] || { echo "::error::$k missing from $f"; exit 1; }
          done
          echo "Pinned nginx: $NGINX_VERSION  angie: $ANGIE_VERSION"
          {
            echo "nginx_version=$NGINX_VERSION"
            echo "nginx_dir=nginx-$NGINX_VERSION"
            echo "nginx_url=https://nginx.org/download/nginx-$NGINX_VERSION.tar.gz"
            echo "nginx_sha256=$NGINX_VERSION_SHA256"
            echo "angie_version=$ANGIE_VERSION"
            echo "angie_dir=angie-$ANGIE_VERSION"
            echo "angie_url=https://download.angie.software/files/angie-$ANGIE_VERSION.tar.gz"
            echo "angie_sha256=$ANGIE_SHA256"
          } >> "$GITHUB_OUTPUT"

  build-nginx:
    name: Build & load (nginx ${{ needs.resolve.outputs.nginx_version }})
    needs: [validation, resolve]
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Build module + load/serve tests
        uses: ./.github/actions/build-module
        with:
          flavor: nginx
          version: ${{ needs.resolve.outputs.nginx_version }}
          url: ${{ needs.resolve.outputs.nginx_url }}
          dir: ${{ needs.resolve.outputs.nginx_dir }}

  # angie ships its own native `acme` directive, but this module's `autocert`
  # directive is independent and coexists with it (the operator chooses), so we
  # build + run the FULL no-network suite on angie just like nginx and publish a
  # build-angie artifact for the Pebble e2e matrix. (Reverses PR #26's
  # compile-only stance — see history.md 2026-06-20.)
  build-angie:
    name: Build & load (angie ${{ needs.resolve.outputs.angie_version }})
    needs: [validation, resolve]
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 20
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Build module + load/serve tests
        uses: ./.github/actions/build-module
        with:
          flavor: angie
          version: ${{ needs.resolve.outputs.angie_version }}
          url: ${{ needs.resolve.outputs.angie_url }}
          dir: ${{ needs.resolve.outputs.angie_dir }}

  # ABI-drift regression. The prod crash was a struct-offset mismatch: the .so
  # was built against vanilla angie, but our packaged angie carries
  # nginx_dynamic_tls_records (adds ngx_ssl_dyn_rec_t to ngx_ssl_s, +32B,
  # shifting ngx_http_ssl_srv_conf_t.certificates 208->240). This builds the
  # module against vanilla AND a synthetically-enlarged ngx_ssl_s tree and
  # proves: matched builds work, mismatched builds are refused by the module's
  # ABI guard (clean [emerg], never SIGSEGV). Self-contained — no dependency on
  # our private deb patches.
  guard-suite:
    name: Guard suite
    needs: [validation, resolve]
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 35
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup build deps
        uses: ./.github/actions/setup
        with:
          ccache-key: guard-${{ needs.resolve.outputs.nginx_version }}-${{ needs.resolve.outputs.angie_version }}

      - name: Restore source tarball cache
        id: tarball-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/src-tarballs
          key: src-tarball-guard-${{ needs.resolve.outputs.nginx_version }}-${{ needs.resolve.outputs.angie_version }}

      - name: Fetch nginx + angie tarballs
        # Do NOT gate on cache-hit: on self-hosted runners actions/cache can
        # report a hit while the path is empty, so always ensure the file is
        # actually present (idempotent — curl only when missing).
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/src-tarballs
          nginx_tar=~/.cache/src-tarballs/nginx-${{ needs.resolve.outputs.nginx_version }}.tar.gz
          angie_tar=~/.cache/src-tarballs/angie-${{ needs.resolve.outputs.angie_version }}.tar.gz
          [ -s "$nginx_tar" ] || curl -fsSL -o "$nginx_tar" "${{ needs.resolve.outputs.nginx_url }}"
          [ -s "$angie_tar" ] || curl -fsSL -o "$angie_tar" "${{ needs.resolve.outputs.angie_url }}"
          # Now that the versions are pinned, the digest can be enforced: a
          # changed upstream archive (or a poisoned runner cache, which is why
          # this also covers the cache-hit path) fails here instead of being
          # compiled. Digests come from .github/versions.env via `resolve`.
          echo "${{ needs.resolve.outputs.nginx_sha256 }}  $nginx_tar" | sha256sum -c -
          echo "${{ needs.resolve.outputs.angie_sha256 }}  $angie_tar" | sha256sum -c -

      - name: ABI-drift guard (matched OK, mismatch refused)
        env:
          ANGIE_URL: ${{ needs.resolve.outputs.angie_url }}
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE" bash ci/tests/e2e/abi-build-and-check.sh

      - name: Test-only directives rejected in prod build
        run: |
          set -euo pipefail
          mkdir -p prod-nginx
          tar -xzf ~/.cache/src-tarballs/nginx-${{ needs.resolve.outputs.nginx_version }}.tar.gz \
            -C prod-nginx --strip-components=1
          cd prod-nginx
          # No AUTOCERT_TEST in the env: the test-only directives must be absent.
          ./configure --with-compat --with-http_ssl_module \
            --with-cc="ccache cc" \
            --with-cc-opt="-Wall -Wextra -Werror" \
            --add-dynamic-module="$GITHUB_WORKSPACE" > /tmp/conf.log 2>&1 \
            || { tail -40 /tmp/conf.log; exit 1; }
          # Full build: `nginx -t` below needs the server binary, not just the .so.
          make > /tmp/make.log 2>&1 || { tail -40 /tmp/make.log; exit 1; }
          test -f objs/ngx_http_autocert_module.so

          # ABI guard: the runtime-cert helpers must NOT be dynamic symbols.
          # nginx dlopen()s modules with RTLD_GLOBAL, and a consumer module
          # vendors a COPY of ngx_autocert_requests.c — if both .so files export
          # these names, ELF interposition binds BOTH modules to whichever loaded
          # first, so an N/N+1 version skew would run one version's code against
          # the other's shm layout and defeat the api_version fail-safe. They are
          # declared NGX_AUTOCERT_REQUESTS_API (hidden visibility) to prevent it.
          # Dump the dynamic symbols ONCE, to a file, and check nm's OWN exit
          # status. Piping nm straight into `grep -c ... || true` is unsound: if
          # nm fails, grep reads empty stdin, prints "0", `|| true` masks the
          # failure, and the gate reports "0 exported" having inspected NOTHING.
          # Requiring a non-empty dump also catches a stripped/empty .so.
          nm -D objs/ngx_http_autocert_module.so > /tmp/dynsyms.txt
          test -s /tmp/dynsyms.txt

          exported="$(grep -c ' T ngx_autocert_requests_' /tmp/dynsyms.txt || true)"
          if [ "$exported" != "0" ]; then
            echo "✗ $exported ngx_autocert_requests_* helper(s) exported from the .so;" \
                 "they must be hidden (NGX_AUTOCERT_REQUESTS_API)"
            grep ' T ngx_autocert_requests_' /tmp/dynsyms.txt
            exit 1
          fi
          echo "✓ runtime-cert helpers are hidden (0 exported, no interposition)"

          # The inverse gate: the cert_cb delegation hook is a DELIBERATE export
          # (default visibility). A consumer module resolves it with
          # dlsym(RTLD_DEFAULT, "ngx_autocert_cert_cb_register") and FAILS SAFE to
          # installing its own cert_cb when the lookup returns NULL. So losing this
          # export breaks delegation SILENTLY -- every consumer stops chaining and
          # starts clobbering our cert_cb again, which is exactly the bug the hook
          # exists to fix, and nothing else in CI would notice.
          if ! grep -q ' T ngx_autocert_cert_cb_register$' /tmp/dynsyms.txt; then
            echo "✗ ngx_autocert_cert_cb_register is NOT exported from the .so;" \
                 "consumer dlsym() would return NULL and delegation would silently" \
                 "fall back to clobbering our cert_cb"
            exit 1
          fi
          echo "✓ cert_cb delegation hook is exported (consumers can dlsym it)"

          BIN=objs/nginx
          test -x "$BIN"
          PREFIX=/tmp/guard; mkdir -p "$PREFIX/conf" "$PREFIX/logs"
          for dir in autocert_test_challenge autocert_test_alpn; do
            cat > "$PREFIX/conf/nginx.conf" <<EOF
          load_module $PWD/objs/ngx_http_autocert_module.so;
          events {}
          http { $dir a b; server { listen 8099; autocert on; } }
          EOF
            out="$("$BIN" -t -p "$PREFIX" -c "$PREFIX/conf/nginx.conf" 2>&1 || true)"
            if printf '%s\n' "$out" | grep -q "unknown directive \"$dir\""; then
              echo "✓ prod build rejects $dir"
            else
              echo "::error::$dir was NOT rejected by a no-flag prod build"
              printf '%s\n' "$out" | sed 's/^/    /'
              exit 1
            fi
          done
          ccache -s || true

      - name: Slow-drip total-read budget (#37)
        run: |
          set -euo pipefail
          run_slowloris() {
            local flavor="$1" version="$2" tarball="$3"
            local dir="slow-${flavor}"
            rm -rf "$dir"; mkdir -p "$dir"
            tar -xzf "$tarball" -C "$dir" --strip-components=1
            cd "$dir"
            # -DNGX_AUTOCERT_READ_TOTAL=2000 shrinks the 60s budget to 2s so the
            # slow-drip abort is observable in a few seconds, not a minute.
            AUTOCERT_TEST=1 ./configure --with-compat --with-http_ssl_module \
              --with-cc="ccache cc" \
              --with-cc-opt="-Wall -Wextra -Werror -DNGX_AUTOCERT_READ_TOTAL=2000" \
              --add-dynamic-module="$GITHUB_WORKSPACE" > "/tmp/conf-${flavor}.log" 2>&1 \
              || { tail -40 "/tmp/conf-${flavor}.log"; exit 1; }
            make > "/tmp/make-${flavor}.log" 2>&1 || { tail -40 "/tmp/make-${flavor}.log"; exit 1; }
            test -f objs/ngx_http_autocert_module.so
            BIN=objs/${flavor}; [ -x "$BIN" ] || BIN=objs/nginx
            test -x "$BIN"
            SERVER_BIN="$PWD/$BIN" NGX_BUILD_DIR="$PWD" \
              bash "$GITHUB_WORKSPACE/ci/tests/e2e/slowloris-read.sh"
            cd "$GITHUB_WORKSPACE"
            echo "✓ slowloris budget guard passed for ${flavor} ${version}"
          }
          run_slowloris nginx "${{ needs.resolve.outputs.nginx_version }}" \
            "$HOME/.cache/src-tarballs/nginx-${{ needs.resolve.outputs.nginx_version }}.tar.gz"
          run_slowloris angie "${{ needs.resolve.outputs.angie_version }}" \
            "$HOME/.cache/src-tarballs/angie-${{ needs.resolve.outputs.angie_version }}.tar.gz"

  unit-tests:
    name: Unit tests
    needs: [resolve, build-nginx, guard-suite]
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 15
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup build deps
        uses: ./.github/actions/setup
        with:
          packages: build-essential libssl-dev

      - name: Download nginx build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: build-nginx
          path: ${{ needs.resolve.outputs.nginx_dir }}

      - name: Build + run unit tests
        env:
          NGX_BUILD_DIR: ${{ github.workspace }}/${{ needs.resolve.outputs.nginx_dir }}
        run: bash ci/tests/unit/run.sh

  # ------------------------------------------------------------------ nginx e2e
  # The full Pebble issuance/renewal suite against nginx. Kept as a matrix (with
  # fail-fast:false) even at one leg so re-adding a flavor is a list entry.
  #
  # The angie leg used to run here too. At ~11.5 minutes per flavor it WAS the
  # wall-clock of every PR on this repo, and the two legs cover the same module
  # logic — angie's divergence is in the surrounding server, which build-angie
  # already exercises with the full no-network load/serve/lifecycle/USR2 suite.
  # The angie Pebble e2e now runs monthly in ci-deep.yml (+ workflow_dispatch),
  # so the flavor is still fully tested, just not on the per-PR path.

  # Batched Pebble e2e: the whole ci/tests/e2e suite for one flavor runs in a
  # SINGLE job via ci/tests/e2e/run-all.sh, so the build artifact is downloaded
  # once and the scripts run against it AC_E2E_JOBS at a time. Flavor jobs run
  # in parallel because run-all.sh exports flavor-scoped host ports. This
  # replaced ~33 per-script x 2-flavor matrix jobs (66 total), each of which had
  # re-paid the checkout + download-artifact + apt boilerplate before a single
  # test. run-all.sh carries the per-script sudo policy + the
  # cert-validate-reject case fan-out and fails the job if ANY script fails
  # (fail-fast off, summary at the end).
  #
  # Measured 2026-08-08, sequential: 41 scripts in 11m03s (nginx) / 11m58s
  # (angie), so ~17s each rather than the ~90s an earlier version of this
  # comment claimed. e2e is the critical path of the whole workflow (16m24s).
  # The per-script timings artifact below is what to read before tuning further.
  #
  # Keep max-parallel above the current two-flavor matrix so future flavor/case
  # expansion does not accidentally serialize after the port namespacing work.
  # The org has 15 self-hosted runners; [self-hosted, builder02, docker] matches
  # 3 of them (builder02-docker-01/02, builder03-docker-01), so a third shard
  # has somewhere to land if the timings justify splitting the suite.
  e2e:
    name: e2e suite (Pebble) [${{ matrix.flavor }}]
    needs: [resolve, build-nginx]
    runs-on: [self-hosted, builder02, docker]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - flavor: nginx
            dir: ${{ needs.resolve.outputs.nginx_dir }}
            port_offset: 0
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup runtime deps
        uses: ./.github/actions/setup
        with:
          packages: libpcre2-8-0

      - name: Install python cryptography for the mock CAs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-cryptography

      - name: Download ${{ matrix.flavor }} build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: build-${{ matrix.flavor }}
          path: ${{ matrix.dir }}

      - name: Run the full e2e suite against ${{ matrix.flavor }}
        run: |
          set -uo pipefail
          NGX="$GITHUB_WORKSPACE/${{ matrix.dir }}"
          # Artifacts don't preserve the exec bit; test EXISTENCE then chmod.
          # nginx ships objs/nginx, angie ships objs/angie.
          BIN="$NGX/objs/${{ matrix.flavor }}"
          [ -f "$BIN" ] || BIN="$NGX/objs/nginx"
          chmod +x "$BIN"
          # Every published host port MUST stay below the ephemeral range
          # (/proc/sys/net/ipv4/ip_local_port_range, 32768 by default). The old
          # scheme spread run_offset over 2000..40000, which pushed ports up into
          # that range, where they raced the kernel's own outbound allocations:
          # docker then failed the container with "port is already allocated" on a
          # RANDOM test (exit 125), and a rerun "fixed" it only because a new run
          # id yielded a new offset. Keep run_offset small enough that
          #   max(PORT_BASES) + run_offset + flavor_offset + max_slot*100 < 32768.
          run_offset=$(( (GITHUB_RUN_ID % 6) * 1500 ))
          port_offset=$(( run_offset + ${{ matrix.port_offset }} ))
          echo "e2e port offset: run_offset=${run_offset} flavor_offset=${{ matrix.port_offset }} port_offset=${port_offset}"

          # Fail LOUDLY if the budget is ever blown — a silent overflow back into
          # the ephemeral range is exactly the failure this guard exists to stop.
          ephemeral_lo=$(cut -f1 < /proc/sys/net/ipv4/ip_local_port_range)
          max_port=$(AC_PORT_OFFSET="$port_offset" \
            bash ci/tests/e2e/max-port.sh)
          echo "e2e highest published port: ${max_port} (ephemeral floor ${ephemeral_lo})"
          if [ "$max_port" -ge "$ephemeral_lo" ]; then
              echo "::error::e2e port budget blown: highest published port ${max_port}" \
                   ">= ephemeral floor ${ephemeral_lo}; shrink run_offset in build-test.yml"
              exit 1
          fi

          # Deliberately sequential (AC_E2E_JOBS unset = 1). run-all.sh supports
          # concurrency, but the suite's PORT_BASES are not disjoint per slot:
          # the bases span 13189 ports while a slot only strides 100, so slot N's
          # high ports land on slot N+1's low ports. Turning it on failed exactly
          # there ("Bind for 0.0.0.0:17053 failed: port is already allocated",
          # and tls-alpn-issue.sh/retry-after.sh, which share AC_PORT_15453).
          # A stride wider than the span would need >13189 per slot and blow the
          # ephemeral ceiling, so the port scheme has to change first.
          SERVER_BIN="$BIN" NGX_BUILD_DIR="$NGX" FLAVOR="${{ matrix.flavor }}" AC_PORT_OFFSET="$port_offset" \
            AC_E2E_TIMINGS="$GITHUB_WORKSPACE/e2e-timings-${{ matrix.flavor }}.tsv" \
            bash ci/tests/e2e/run-all.sh

      # Per-script wall-clock, slowest first. Kept as an artifact so shard
      # balancing reads measured numbers instead of re-deriving them from a log
      # (job logs expire well before anyone gets round to the sharding work).
      # if: always() — a failing suite still produces useful timings, and the
      # slow script is often the one that failed.
      - name: Upload e2e timings
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: e2e-timings-${{ matrix.flavor }}
          path: e2e-timings-${{ matrix.flavor }}.tsv
          if-no-files-found: warn
          retention-days: 30
