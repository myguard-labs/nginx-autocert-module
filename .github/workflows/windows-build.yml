# sync-sha: bbfc13b6baa065c0d9b6f9a3504dc7de3a173a720242f8328350f970923f27e5
name: Windows build

# Native Windows port gate (W17). Proves the module compiles and links on
# win32, and -- since W18a -- that its HTTP-01 challenge-serve path actually
# works at runtime: the MSVC lane starts the built nginx.exe and asserts
# against it (see "Runtime HTTP-01 challenge-serve test" below).
#
# Still NOT covered here: full ACME issuance against a CA. The Pebble e2e
# suite runs Linux Docker containers (ci/tests/e2e/*.sh call `docker cp`
# against the pebble image) and a windows-latest runner only supports Windows
# containers. Pebble does ship a native windows-amd64 binary, so that gap is
# closable without Docker -- tracked as W18b.
#
# Kept out of build-test.yml deliberately: that workflow's jobs are Linux
# (self-hosted builder02 for resolve, ubuntu for the matrices) and share the
# build-<flavor> artifact contract, none of which applies here. A separate file
# also means a win32 failure reads as "the Windows port broke" in the checks
# list rather than as one red cell in an otherwise Linux matrix.
#
# Third-party actions pinned to commit SHAs for supply-chain safety.
# Pin table (canonical for all workflow files — keep consistent):
# actions/checkout@v5          -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/cache@v4             -> 0057852bfaa89a56745cba8c7296529d2fc39830
# actions/upload-artifact@v5   -> 330a01c490aca151604b8cf639adc76d48f6c5d4
# msys2/setup-msys2@v2         -> 66cd2cce69caa17b53920067426061ca1de3a884 (v2.32.0)

on:
  pull_request:
    # Only the inputs that can break a win32 build. The Linux suite already
    # gates src/ on every PR, and duplicating that here would double the wait
    # for changes that cannot affect this job.
    paths:
      - 'src/**'
      - 'config'
      - '.github/workflows/windows-build.yml'
      - '.github/versions.env'
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cache-key salt for the pinned build dependencies. Bump this when any of the
# PCRE2 / zlib / OpenSSL versions or their sha256s change below, so the caches
# invalidate with them. Kept as one constant rather than spelling the versions
# into each key: the keys stay short, and there is a single place to change.
env:
  DEPS_KEY: pcre2-10.44-zlib-1.3.1-ossl-3.5.4

jobs:
  msvc:
    name: MSVC x64 static-link build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Same pin file the Linux workflows read, so win32 builds the same nginx
      # the rest of CI does. Parsed with PowerShell rather than sourced, since
      # this is the one job that does not run under bash.
      - name: Load pinned nginx version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content .github/versions.env |
            Where-Object { $_ -match '^(NGINX_VERSION|NGINX_VERSION_SHA256)=' } |
            ForEach-Object { $_ >> $env:GITHUB_ENV }

      - name: Fetch and verify nginx
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tarball = "nginx-$env:NGINX_VERSION.tar.gz"
          # Bounded: pwsh 7.4+ has no -TimeoutSec and both replacements default
          # to indefinite. OperationTimeoutSeconds is a per-read stall limit,
          # not a total-transfer cap, so a slow-but-progressing download is
          # unaffected -- only a wedged one dies.
          Invoke-WebRequest -Uri "https://nginx.org/download/$tarball" `
            -OutFile $tarball `
            -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 60

          # Same rule as the Linux fetches: a changed upstream archive fails the
          # build rather than getting compiled. -ne on the string compare is
          # case-sensitive, so normalise both sides first.
          $actual = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLower()
          $want = $env:NGINX_VERSION_SHA256.ToLower()
          if ($actual -ne $want) {
            throw "sha256 mismatch for ${tarball}: got $actual, want $want"
          }
          tar -xzf $tarball
          if ($LASTEXITCODE -ne 0) { throw "tar failed with $LASTEXITCODE" }

      # The runner ships vcpkg but installs no packages into it, so
      # VCPKG_INSTALLATION_ROOT\installed is empty on a fresh image. Build the
      # one port we need. --triplet x64-windows-static matters: it produces a
      # static OpenSSL linked against the static CRT, which is what nginx's
      # win32 build uses. Mixing CRT models links but crashes at runtime on the
      # first allocation that crosses the boundary.
      #
      # Cached because a cold OpenSSL build is several minutes and the inputs
      # move only when the vcpkg baseline does.
      - name: Cache vcpkg OpenSSL
        id: vcpkg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Literal path, not ${{ env.VCPKG_INSTALLATION_ROOT }}: that variable
          # is set by the runner image rather than by this workflow, and the
          # env context here would expand to empty, silently caching nothing.
          path: C:\vcpkg\installed
          key: vcpkg-openssl-x64-windows-static-${{ runner.os }}-v1

      - name: Install OpenSSL via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with $LASTEXITCODE" }

      # Immutable, sha256-pinned tarballs, so cache the transfer. The hash check
      # in the fetch step still runs against whatever is restored, so a bad
      # cache entry fails the build rather than being compiled.
      - name: Cache source tarballs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            pcre2-10.44.tar.gz
            zlib-1.3.1.tar.gz
          key: srctars-msvc-${{ env.DEPS_KEY }}

      # nginx's win32 build has no system package manager to find PCRE and zlib
      # in, so both are built from source alongside it via --with-pcre=/--with-zlib=
      # (the http_rewrite module hard-requires PCRE). Versions match what the W0c
      # probe used. These are build-time-only dependencies of nginx core, not of
      # this module, and are pinned by sha256 for the same reason nginx is.
      - name: Fetch PCRE2 and zlib
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = @(
            @{ name = 'pcre2-10.44'
               url  = 'https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz'
               sha  = '86b9cb0aa3bcb7994faa88018292bc704cdbb708e785f7c74352ff6ea7d3175b' },
            @{ name = 'zlib-1.3.1'
               url  = 'https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz'
               sha  = '9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23' }
          )
          foreach ($d in $deps) {
            $tar = "$($d.name).tar.gz"
            # Skip the transfer on a cache hit; the hash check below still runs.
            if (-not (Test-Path $tar)) {
              Invoke-WebRequest -Uri $d.url -OutFile $tar `
                -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 60
            }
            $actual = (Get-FileHash $tar -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $d.sha) {
              throw "sha256 mismatch for ${tar}: got $actual, want $($d.sha)"
            }
            tar -xzf $tar
            if ($LASTEXITCODE -ne 0) { throw "tar failed for $tar" }
          }

      - name: Locate OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ssl = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static"
          if (-not (Test-Path "$ssl\lib\libssl.lib")) {
            # Fail loudly with what IS present. A silent fallback to a different
            # OpenSSL would make the link line untrustworthy, which is the exact
            # thing this job exists to verify.
            Write-Host "contents of $ssl\lib:"
            Get-ChildItem "$ssl\lib" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.Name)" }
            throw "libssl.lib not found under $ssl"
          }
          # nginx's MSVC branch does not probe for OpenSSL: it takes
          # --with-openssl=<path> and hardcodes <path>/openssl/include and
          # <path>/openssl/lib (auto/lib/openssl/conf:22-32). Without that flag
          # it falls through to the POSIX probe, which tries -lssl -lcrypto and
          # fails under cl - "SSL modules require the OpenSSL library" even
          # though OpenSSL is right there.
          #
          # vcpkg's layout is flat (include/, lib/), so stage a tree in the
          # shape configure expects. Junctions, not copies: same content, no
          # duplication of a large lib dir.
          $stage = "$env:GITHUB_WORKSPACE\ossl-stage"
          New-Item -ItemType Directory -Force -Path "$stage\openssl" | Out-Null
          foreach ($sub in 'include', 'lib') {
            $link = "$stage\openssl\$sub"
            if (-not (Test-Path $link)) {
              New-Item -ItemType Junction -Path $link -Target "$ssl\$sub" | Out-Null
            }
          }
          if (-not (Test-Path "$stage\openssl\include\openssl\ssl.h")) {
            throw "staged tree is missing openssl/ssl.h - layout assumption is wrong"
          }
          if (-not (Test-Path "$stage\openssl\lib\libssl.lib")) {
            throw "staged tree is missing libssl.lib - layout assumption is wrong"
          }

          "OPENSSL_ROOT=$ssl" >> $env:GITHUB_ENV
          "OPENSSL_STAGE=$stage" >> $env:GITHUB_ENV
          Write-Host "vcpkg OpenSSL at $ssl, staged for configure at $stage"

      # configure is a shell script, so it runs under the runner's bash even
      # though the compiler is MSVC. Three constraints, each of which cost a
      # round-trip when W0c established this recipe by hand:
      #
      #  1. --crossbuild=win32 is mandatory. Without it configure misdetects the
      #     OS (bash `uname` reports MINGW64_NT) and dies "C compiler is not
      #     found" before it ever tests cl.
      #  2. --add-module needs a WINDOWS path. The MSYS form (/c/...) configures
      #     fine and then fails under nmake with U1073, far from its cause.
      #  3. There is no dynamic-module support on win32 (B1), so this is the
      #     static-link path: the module is linked into nginx.exe itself.
      #
      # -MT pairs nginx with the static CRT, matching the x64-windows-static
      # OpenSSL above. A mismatch here links cleanly and then fails at runtime,
      # because the two CRTs keep separate heaps and allocator state.
      # crypt32/user32 are OpenSSL's own win32 dependencies, which a static
      # libcrypto does not pull in on its own.
      # AUTOCERT_TEST=1 compiles in the test-only seed directives
      # (autocert_test_challenge / autocert_test_alpn; see config:28). They are
      # what lets the runtime step below seed a token->keyauth without an ACME
      # server, and they are deliberately absent from production builds so a
      # stray directive cannot inject a forged key authorization the :80
      # handler would serve. Scoped to this CI job only -- the uploaded
      # artifact is a TEST binary, not a release one.
      - name: Configure
        shell: bash
        working-directory: nginx-${{ env.NGINX_VERSION }}
        env:
          AUTOCERT_TEST: "1"
        run: |
          set -euo pipefail
          # Both must be Windows paths with forward slashes: configure needs the
          # drive-letter form (trap 2 above), while backslashes would be eaten
          # as escapes by the shell and by the generated makefile.
          MODULE_DIR=$(cygpath -w "$GITHUB_WORKSPACE")
          MODULE_DIR=${MODULE_DIR//\\//}
          SSL_STAGE=${OPENSSL_STAGE//\\//}
          # PCRE2 and zlib unpack in the workspace root, one level above the
          # nginx tree this step runs in, and need the same Windows-path form.
          DEPS=$MODULE_DIR

          ./configure \
            --crossbuild=win32 \
            --with-cc=cl \
            --builddir=objs \
            --prefix= \
            --conf-path=conf/nginx.conf \
            --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log \
            --error-log-path=logs/error.log \
            --sbin-path=nginx.exe \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --with-cc-opt="-DFD_SETSIZE=1024 -MT" \
            --with-ld-opt="user32.lib" \
            --with-openssl="$SSL_STAGE" \
            --with-pcre="$DEPS/pcre2-10.44" \
            --with-zlib="$DEPS/zlib-1.3.1" \
            --with-http_ssl_module \
            --add-module="$MODULE_DIR"

      # vcvars64.bat is located with vswhere rather than hardcoded: the runner
      # image has shipped both the Enterprise and Community editions at
      # different times, and the path embeds the edition name. vswhere itself
      # is at a fixed, Microsoft-documented location.
      - name: Locate vcvars64.bat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $root = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $root) { throw "vswhere found no VC++ toolchain" }
          $vcvars = "$root\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          "VCVARS=$vcvars" >> $env:GITHUB_ENV
          Write-Host "using $vcvars"

      # nginx's makefile.msvc builds the bundled PCRE2/zlib as a single
      # `cd <lib> && cl ... && link -lib ...` chain, which returns 0x1/0x2 under
      # nmake even though each half succeeds standalone (W0c hit this by hand).
      # Building the two .lib files first sidesteps it: nmake then finds them
      # already present and proceeds. A failure here is a real failure, so the
      # step is not tolerant of a bad exit.
      # auto/lib/openssl/make emits a rule making
      # <stage>/openssl/include/openssl/ssl.h depend on objs/Makefile, whose
      # recipe builds OpenSSL from source. configure writes that makefile after
      # the staged tree exists, so ssl.h is older than its dependency and nmake
      # would rebuild a perfectly good prebuilt OpenSSL. Touching the staged
      # headers and libs afterwards makes the rule already-satisfied.
      #
      # Junctions are transparent to timestamps, so this stamps the real vcpkg
      # files. That is fine: they are throwaway CI state, not a shared cache.
      - name: Mark the staged OpenSSL as up to date
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $now = Get-Date
          foreach ($p in "$env:OPENSSL_STAGE\openssl\include\openssl\ssl.h",
                         "$env:OPENSSL_STAGE\openssl\lib\libssl.lib",
                         "$env:OPENSSL_STAGE\openssl\lib\libcrypto.lib") {
            if (-not (Test-Path $p)) { throw "expected staged file missing: $p" }
            (Get-Item $p).LastWriteTime = $now
          }

      - name: Pre-build PCRE2 and zlib
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1

          cd pcre2-10.44 || exit /b 1
          copy /y src\config.h.generic src\config.h || exit /b 1
          copy /y src\pcre2.h.generic src\pcre2.h || exit /b 1
          copy /y src\pcre2_chartables.c.dist src\pcre2_chartables.c || exit /b 1
          cl -c -O2 -MT -DHAVE_CONFIG_H -DPCRE2_CODE_UNIT_WIDTH=8 -DPCRE2_STATIC -Isrc ^
            src\pcre2_auto_possess.c src\pcre2_chartables.c src\pcre2_compile.c ^
            src\pcre2_config.c src\pcre2_context.c src\pcre2_convert.c ^
            src\pcre2_dfa_match.c src\pcre2_error.c src\pcre2_extuni.c ^
            src\pcre2_find_bracket.c src\pcre2_maketables.c src\pcre2_match.c ^
            src\pcre2_match_data.c src\pcre2_newline.c src\pcre2_ord2utf.c ^
            src\pcre2_pattern_info.c src\pcre2_script_run.c src\pcre2_serialize.c ^
            src\pcre2_string_utils.c src\pcre2_study.c src\pcre2_substitute.c ^
            src\pcre2_substring.c src\pcre2_tables.c src\pcre2_ucd.c ^
            src\pcre2_valid_utf.c src\pcre2_xclass.c || exit /b 1
          link -lib -out:pcre2-8.lib *.obj || exit /b 1
          cd .. || exit /b 1

          cd zlib-1.3.1 || exit /b 1
          cl -c -O2 -MT adler32.c crc32.c deflate.c infback.c inffast.c ^
            inflate.c inftrees.c trees.c zutil.c compress.c uncompr.c gzclose.c ^
            gzlib.c gzread.c gzwrite.c || exit /b 1
          link -lib -out:zlib.lib *.obj || exit /b 1
          cd .. || exit /b 1

      - name: Build
        shell: cmd
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          call "%VCVARS%" || exit /b 1
          nmake -f objs/Makefile || exit /b 1

      # A green nmake is not by itself proof the module went in: a config that
      # silently failed to register the addon still builds a perfectly good
      # stock nginx.exe. Assert the module is actually present.
      - name: Verify the module linked in
        shell: pwsh
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path objs\nginx.exe)) { throw "objs\nginx.exe was not produced" }

          $obj = 'objs\addon\src\ngx_http_autocert_module.obj'
          if (-not (Test-Path $obj)) { throw "$obj missing - the addon did not compile" }

          # The generated module table is what actually wires the module into
          # the binary; a stale objs/ could leave the .obj above behind.
          $table = Get-Content objs\ngx_modules.c -Raw
          if ($table -notmatch 'ngx_http_autocert_module') {
            throw "ngx_http_autocert_module absent from objs/ngx_modules.c"
          }
          Write-Host "module present in ngx_modules.c and objs/nginx.exe built"

      # -t exercises the module's directive table: it registers autocert_* at
      # module load, so an unknown-directive error here means the module is in
      # the binary but not wired up. The negative control is what makes the
      # positive result meaningful - without it, a config that silently ignored
      # unknown directives would also "pass".
      - name: Smoke-test the directive table
        shell: pwsh
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path conf, logs, temp | Out-Null

          # autocert_store_path is NGX_HTTP_MAIN_CONF|NGX_CONF_TAKE1
          # (ngx_http_autocert_module.c:205), so it goes directly in http{},
          # not in a server block.
          #
          # Built by joining lines rather than with a PowerShell here-string:
          # a here-string's terminator must sit at column 0, which would end
          # this YAML block scalar early.
          function Write-Conf([string]$directive) {
            $lines = @(
              'events { worker_connections 64; }',
              'http {',
              "    $directive",
              '    server {',
              '        listen 8099;',
              '        server_name localhost;',
              '    }',
              '}'
            )
            Set-Content -Encoding ascii -Path conf/nginx.conf -Value $lines
          }

          # nginx -t writes its verdict to stderr and exits non-zero on a bad
          # config - both are EXPECTED here, and both fight the step's error
          # handling. Under $ErrorActionPreference='Stop', merging native
          # stderr into the pipeline ('2>&1') makes every [emerg] line a
          # TERMINATING error; and pwsh fails a step whose final $LASTEXITCODE
          # is non-zero, which the negative control deliberately leaves. So run
          # nginx with error handling relaxed and hand the exit code back
          # explicitly, then assert on the returned value.
          function Invoke-NginxTest {
            $prev = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & .\objs\nginx.exe -p . -c conf/nginx.conf -t 2>&1 |
                Out-String |
                Write-Host
              return $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $prev
            }
          }

          # Positive: a real directive must be accepted.
          Write-Conf 'autocert_store_path temp/store;'
          if ((Invoke-NginxTest) -ne 0) {
            throw "nginx -t rejected a valid autocert directive"
          }

          # Negative control: a bogus directive must be REJECTED. If this passes,
          # the check above proved nothing.
          Write-Conf 'autocert_NOT_A_DIRECTIVE on;'
          if ((Invoke-NginxTest) -eq 0) {
            throw "negative control passed: nginx -t accepted a bogus directive"
          }
          Write-Host "directive table verified (valid accepted, bogus rejected)"

          # Both assertions held. Clear the negative control's deliberate
          # non-zero $LASTEXITCODE so the step's own verdict is what exits.
          exit 0

      # W18a: the first RUNTIME test on win32 -- everything before this point
      # proves the binary builds and parses a config, not that it serves.
      #
      # Mirrors ci/tests/e2e/http01-challenge.sh, which is deliberately
      # "no network / no docker": it seeds a token->keyauth through the
      # test-only autocert_test_challenge directive and asserts the :80
      # challenge handler serves it. No ACME server is involved, so this is
      # independent of the Pebble work (W18b) and of any container support.
      #
      # Pwsh rules earned in W28 apply to every nginx.exe invocation here:
      # $ErrorActionPreference='Stop' plus '2>&1' turns nginx's own stderr
      # into a TERMINATING error, and a non-zero $LASTEXITCODE at step end
      # fails the step regardless of the assertions' verdict.
      - name: Runtime HTTP-01 challenge-serve test
        shell: pwsh
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'

          $port    = 8088
          $token   = 'evaGxfADs6pSRb2LMJ7rzMrXXX0123456789abcdefg'
          $keyauth = "$token.9jg46WB3rR_AHD-EBXdN7cBkH1WOu0tA3M9fm21mqTI"

          New-Item -ItemType Directory -Force `
            -Path conf, logs, temp, temp/store | Out-Null

          # ABSOLUTE store path, with forward slashes. A relative one is
          # resolved against the CONFIG FILE's directory, not the -p prefix, so
          # "temp/store" became "./conf/temp/store" and the driver failed with
          # "cannot open/create store dir ... (31: A device attached to the
          # system is not functioning)" -- ERROR_GEN_FAILURE, which is what
          # win32 reports here for a path that is not there, not a hardware
          # fault. The token was then never seeded and the readiness wait
          # timed out.
          #
          # The directive-table step above gets away with "temp/store" because
          # nginx -t never opens the store; this is the first step that runs
          # the server for real.
          $store = ((Resolve-Path temp/store).Path -replace '\\', '/')

          # worker_processes 1: this test is about the challenge-serve path.
          # The N>1 singleton assertion is W19 and needs its own config.
          # No 'user' directive -- nginx ignores it on win32 (and warns).
          $lines = @(
            'error_log logs/error.log notice;',
            'events { worker_connections 64; }',
            'http {',
            "    autocert_store_path $store;",
            # Point the CA at a dead loopback port. This test is about serving
            # a seeded challenge, not about issuance, and the default CA is
            # Let's Encrypt PRODUCTION -- without this the driver tries to
            # register a real ACME account on every CI run. It fails harmlessly
            # either way, but CI has no business dialling a live CA.
            '    autocert_ca https://127.0.0.1:1/directory;',
            "    autocert_test_challenge $token `"$keyauth`";",
            '    server {',
            "        listen $port;",
            '        server_name a.example.com;',
            '        autocert on;',
            '    }',
            '}'
          )
          Set-Content -Encoding ascii -Path conf/nginx.conf -Value $lines

          # Guard against a vacuous pass: if AUTOCERT_TEST=1 did not reach the
          # compiler, autocert_test_challenge is not in the binary and nginx -t
          # rejects it as unknown. Without this, a build that silently dropped
          # the define would fail below in a way that looks like a serve bug.
          $prev = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $tOut = (& .\objs\nginx.exe -p . -c conf/nginx.conf -t 2>&1 |
                     Out-String)
          $tRc  = $LASTEXITCODE
          $ErrorActionPreference = $prev
          Write-Host $tOut
          if ($tRc -ne 0) {
            throw "nginx -t rejected the test config " +
                  "(is AUTOCERT_TEST=1 reaching the compiler?)"
          }

          # nginx does NOT daemonize on win32: the whole ngx_daemon() branch in
          # src/core/nginx.c:343 sits inside #if !(NGX_WIN32), and there is no
          # ngx_daemon.c under src/os/win32 at all. The master runs in the
          # FOREGROUND, so calling it directly -- as the POSIX script does,
          # where nginx forks and the shell returns -- blocks this step until
          # the job timeout. Start it detached and keep the handle.
          Write-Host "== start =="
          $proc = Start-Process -FilePath (Resolve-Path .\objs\nginx.exe) `
                    -ArgumentList '-p', '.', '-c', 'conf/nginx.conf' `
                    -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            if (Test-Path logs/error.log) {
              Get-Content logs/error.log | Write-Host
            }
            throw "nginx.exe exited immediately with $($proc.ExitCode)"
          }

          try {
            # Wait for the seed to land rather than sleeping a fixed interval:
            # the log line is the real readiness signal, and a fixed sleep is
            # a flake waiting to happen on a loaded runner.
            $seeded = $false
            foreach ($i in 1..60) {
              if ((Test-Path logs/error.log) -and
                  (Select-String -Path logs/error.log -SimpleMatch `
                     -Pattern 'seeded test challenge token' -Quiet)) {
                $seeded = $true; break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $seeded) {
              if (Test-Path logs/error.log) {
                Get-Content logs/error.log | Write-Host
              }
              throw "worker never logged 'seeded test challenge token'"
            }

            $base = "http://127.0.0.1:$port/.well-known/acme-challenge"

            Write-Host "== fetch valid token =="
            # Bounded: pwsh 7.4+ dropped -TimeoutSec, and both replacement
            # timeouts default to INDEFINITE. An unbounded request against a
            # wedged worker would eat the whole job timeout instead of failing
            # here with a usable message.
            $r = Invoke-WebRequest -Uri "$base/$token" -UseBasicParsing `
                   -ConnectionTimeoutSeconds 10 -OperationTimeoutSeconds 10
            if ($r.Content -ne $keyauth) {
              throw "wrong keyauth: got '$($r.Content)' want '$keyauth'"
            }
            Write-Host "OK served exact key authorization"

            # Content-Length must match the keyauth exactly -- a truncated or
            # padded body with a 200 would otherwise pass the check above.
            #
            # The Headers indexer yields a String[] (HTTP headers are
            # multi-valued), so casting it straight to [int] throws
            # "Cannot convert ... System.String[] ... to type System.Int32".
            # Take the first value explicitly.
            $clen = [int](@($r.Headers['Content-Length'])[0])
            if ($clen -ne $keyauth.Length) {
              throw "Content-Length $clen != $($keyauth.Length)"
            }
            Write-Host "OK Content-Length correct"

            # Invoke-WebRequest throws on 4xx by default. -SkipHttpErrorCheck
            # (pwsh 6+) returns the response instead, which is what we want:
            # a 404 IS the expected result here. Do NOT "fix" this into a
            # try/catch on [System.Net.WebException] -- pwsh 7 raises
            # HttpRequestException, so that catch never fires and the step
            # dies instead of asserting.
            function Get-Status([string]$uri) {
              (Invoke-WebRequest -Uri $uri -UseBasicParsing `
                 -SkipHttpErrorCheck `
                 -ConnectionTimeoutSeconds 10 `
                 -OperationTimeoutSeconds 10).StatusCode
            }

            Write-Host "== unknown token -> 404 =="
            $code = Get-Status "$base/doesnotexist"
            if ($code -ne 404) { throw "unknown token gave $code, want 404" }
            Write-Host "OK unknown token 404"

            Write-Host "== token with extra path segment -> 404 =="
            $code = Get-Status "$base/$token/extra"
            if ($code -ne 404) { throw "nested path gave $code, want 404" }
            Write-Host "OK nested path declined"

            # Regression: a GET carrying a request body on a keepalive
            # connection must not desync it. The content-phase handler emits
            # its own response and so must discard the unread body, or the
            # leftover bytes are parsed as the next pipelined request's start
            # line (request-smuggling / keepalive-framing bug). Both requests
            # go out in ONE send, which is the point of the test.
            Write-Host "== GET-with-body on keepalive must not desync =="
            $path = "/.well-known/acme-challenge/$token"
            $body = 'BODYBYTES'
            $req1 = "GET $path HTTP/1.1`r`nHost: a.example.com`r`n" +
                    "Content-Length: $($body.Length)`r`n" +
                    "Connection: keep-alive`r`n`r`n" + $body
            $req2 = "GET $path HTTP/1.1`r`nHost: a.example.com`r`n" +
                    "Connection: close`r`n`r`n"

            $client = New-Object System.Net.Sockets.TcpClient
            $client.Connect('127.0.0.1', $port)
            $stream = $client.GetStream()
            $stream.ReadTimeout = 5000
            $bytes = [System.Text.Encoding]::ASCII.GetBytes($req1 + $req2)
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush()

            $sb = New-Object System.Text.StringBuilder
            $buf = New-Object byte[] 4096
            try {
              while ($true) {
                $n = $stream.Read($buf, 0, $buf.Length)
                if ($n -le 0) { break }
                [void]$sb.Append(
                  [System.Text.Encoding]::ASCII.GetString($buf, 0, $n))
              }
            } catch [System.IO.IOException] {
              # read timeout: server sent all it intends to
            } finally {
              $stream.Close(); $client.Close()
            }
            $resp = $sb.ToString()

            # The keyauth body carries no trailing newline, so response #2's
            # status line is glued to the end of body #1 -- count OCCURRENCES,
            # never lines.
            $n200 = ([regex]::Matches($resp, 'HTTP/1\.1 200')).Count
            $nkey = ([regex]::Matches($resp, [regex]::Escape($keyauth))).Count
            if ($n200 -ne 2 -or $nkey -ne 2 -or $resp -match 'HTTP/1\.1 400') {
              Write-Host $resp
              throw "keepalive desync after GET-with-body " +
                    "(200s=$n200 keyauth=$nkey)"
            }
            Write-Host "OK GET-with-body discarded; keepalive framing intact"

            Write-Host "HTTP-01 challenge serve path verified on win32"
          }
          finally {
            $ErrorActionPreference = 'Continue'
            & .\objs\nginx.exe -p . -c conf/nginx.conf -s stop 2>&1 |
              Out-String | Write-Host
            # -s stop only signals the master. If it did not take, the
            # foreground process outlives the step and hangs the job, so kill
            # unconditionally rather than trusting the signal.
            if (-not $proc.WaitForExit(10000)) {
              Write-Host "nginx did not exit on -s stop; killing"
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Get-Process -Name nginx -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            $ErrorActionPreference = $prev
            if (Test-Path logs/error.log) {
              Write-Host "== error.log =="
              Get-Content logs/error.log | Select-Object -Last 40 | Write-Host
            }
          }

          # -s stop's exit status is irrelevant to the verdict; the assertions
          # above already threw on failure. Clear it so the step exits on its
          # own result (W28).
          exit 0

      # W19: the ACME engine must run in exactly ONE process. On POSIX that is
      # enforced by the ngx_worker == 0 gate in
      # ngx_http_autocert_module.c:378. On win32 that gate FAILS OPEN --
      # src/os/win32/ngx_process_cycle.c declares ngx_uint_t ngx_worker at :32
      # and never assigns it (the POSIX cycle assigns it at :704), so it is 0
      # in every worker and all of them reach the driver. The named mutex
      # (Global\ngx_autocert_singleton_<hash>, taken in
      # ngx_autocert_win32_driver_trylock) is the ONLY thing stopping N
      # concurrent ACME engines from sharing one store.
      #
      # The existing Linux unit oracles (test_win32_singleton_name.c,
      # test_win32_mutex_verdict.c) cover the name derivation and the
      # wait-result mapping as pure logic. Neither boots two processes, so
      # neither can catch a regression that breaks the actual mutual
      # exclusion. This step is that missing assertion.
      - name: Multi-worker singleton test (exactly one driver arms)
        shell: pwsh
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prev = $ErrorActionPreference

          # Separate prefix from the HTTP-01 step so the two runs cannot see
          # each other's store or log.
          $root = 'w19'
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force `
            -Path $root, "$root/conf", "$root/logs", "$root/temp", `
                  "$root/store" | Out-Null

          # Absolute, forward-slashed, for the same reason as the HTTP-01 step:
          # a relative store path resolves against the config file's directory,
          # not -p, and the driver then fails to open it.
          $store = ((Resolve-Path "$root/store").Path -replace '\\', '/')

          # worker_processes 2 is the whole point: win32 spawns that many real
          # processes (ngx_start_worker_processes loops ngx_spawn_process at
          # ngx_process_cycle.c:377), each entering init_process with
          # ngx_worker == 0.
          $lines = @(
            'worker_processes 2;',
            'error_log logs/error.log notice;',
            'events { worker_connections 64; }',
            'http {',
            "    autocert_store_path $store;",
            # Dead loopback CA, same as the HTTP-01 step: this test is about
            # which worker ARMS the driver, not about reaching a CA, and the
            # default is Let's Encrypt production.
            '    autocert_ca https://127.0.0.1:1/directory;',
            '    server {',
            '        listen 8100;',
            '        server_name a.example.com;',
            '        autocert on;',
            '    }',
            '}'
          )
          Set-Content -Encoding ascii -Value $lines `
            -Path "$root/conf/nginx.conf"

          $ErrorActionPreference = 'Continue'
          & .\objs\nginx.exe -p $root -c conf/nginx.conf -t 2>&1 |
            Out-String | Write-Host
          $tRc = $LASTEXITCODE
          $ErrorActionPreference = $prev
          if ($tRc -ne 0) { throw "nginx -t rejected the multi-worker config" }

          # Foreground on win32 -- see the HTTP-01 step: nginx's daemonize path
          # is #if !(NGX_WIN32), so a direct call never returns.
          $proc = Start-Process -FilePath (Resolve-Path .\objs\nginx.exe) `
                    -ArgumentList '-p', $root, '-c', 'conf/nginx.conf' `
                    -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            if (Test-Path "$root/logs/error.log") {
              Get-Content "$root/logs/error.log" | Write-Host
            }
            throw "nginx.exe exited immediately with $($proc.ExitCode)"
          }

          $log = "$root/logs/error.log"
          try {
            # Wait for BOTH workers to get through init_process before
            # counting. Sampling too early reads "one armed" simply because
            # the second worker has not started yet -- which is exactly the
            # false pass this test exists to avoid. "start worker processes"
            # is logged by the master once; the per-worker evidence is the
            # arm line plus the mutex-contention path, so wait on the process
            # count instead.
            $deadline = (Get-Date).AddSeconds(30)
            $workers = 0
            while ((Get-Date) -lt $deadline) {
              $workers = @(Get-Process -Name nginx `
                             -ErrorAction SilentlyContinue).Count
              # master + 2 workers
              if ($workers -ge 3) { break }
              Start-Sleep -Milliseconds 250
            }
            if ($workers -lt 3) {
              throw "expected master + 2 workers, saw $workers nginx processes"
            }

            # Both workers are up; give the loser's trylock time to land in
            # the log before counting.
            Start-Sleep -Seconds 3

            if (-not (Test-Path $log)) { throw "no error.log produced" }
            $text = Get-Content $log -Raw

            $armed = ([regex]::Matches(
              $text, 'ACME driver armed on worker 0, pid \d+')).Count

            Write-Host "== error.log =="
            Write-Host $text

            # THE assertion. Two workers reached the driver; exactly one may
            # own the singleton. 0 means nobody arms and issuance is dead; >1
            # means two ACME engines share a store, which is the bug the mutex
            # exists to prevent.
            if ($armed -ne 1) {
              throw "expected exactly 1 armed driver across 2 workers, " +
                    "got $armed"
            }
            Write-Host "OK exactly one worker armed the ACME driver"

            # Negative control for the counter itself: if the regex could not
            # match a second arm line, the check above would pass no matter
            # how badly the mutex failed. Prove it counts 2 when 2 are present.
            $probe = $text + "`n" +
                     '2026/01/01 00:00:00 [notice] 999#0: autocert: ' +
                     'ACME driver armed on worker 0, pid 999'
            $probeCount = ([regex]::Matches(
              $probe, 'ACME driver armed on worker 0, pid \d+')).Count
            if ($probeCount -ne 2) {
              throw "counter is broken: injected a 2nd arm line, " +
                    "counted $probeCount"
            }
            Write-Host "OK counter distinguishes 1 from 2"
          }
          finally {
            $ErrorActionPreference = 'Continue'
            & .\objs\nginx.exe -p $root -c conf/nginx.conf -s stop 2>&1 |
              Out-String | Write-Host
            # -s stop signals the master only; kill any survivor so a stuck
            # foreground process cannot outlive the step and hang the job.
            if (-not $proc.WaitForExit(10000)) {
              Write-Host "nginx did not exit on -s stop; killing"
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Get-Process -Name nginx -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            $ErrorActionPreference = $prev
          }

          exit 0

      # W18b: full ACME issuance (RFC 8738 IP-literal), ported from the POSIX
      # e2e script ci/tests/e2e/ipv4-issue.sh. That script runs Pebble and
      # pebble-challtestsrv as Linux Docker containers on a docker network,
      # using the network's gateway IP as both the ordered identifier and the
      # address the VA dials. None of that exists here:
      #
      #  - windows-latest hosts no Linux containers. Pebble ships a native
      #    windows-amd64 binary (CGO_ENABLED=0 build), fetched below instead
      #    of built or dockerized.
      #  - challtestsrv exists ONLY to resolve the CA's own "pebble" hostname
      #    for the module's ACME client; every challenge listener is disabled
      #    in the bash version (-http01 "" -https01 "" -tlsalpn01 ""). Pointed
      #    directly at https://127.0.0.1:14000/dir there is nothing left for
      #    it to do, so it is dropped rather than ported.
      #  - HOST_IP there is the docker network gateway. On this runner the
      #    ordered identifier is 127.0.0.1: both nginx and Pebble's VA are on
      #    the same host, so the VA's http-01 GET reaches nginx over loopback
      #    without any network setup. Confirmed working in this job (see the
      #    "authorization ... is valid" assertion below) rather than assumed.
      - name: Runtime ACME issuance test (IPv4 literal, RFC 8738)
        shell: pwsh
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'

          $root   = 'w18b'
          $hostIp = '127.0.0.1'
          $httpPort  = 5002
          $pebblePort = 14000

          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          # "temp" is not optional: the build configures
          # --http-client-body-temp-path=temp/client_body_temp (and the proxy,
          # fastcgi, uwsgi, scgi siblings) RELATIVE to the prefix, and nginx
          # creates them at startup. Without it `nginx -t` reports "syntax is
          # ok" and then fails with
          #   [emerg] CreateDirectory() "temp/client_body_temp" failed (3)
          # which reads like a config error but is a missing directory.
          New-Item -ItemType Directory -Force `
            -Path $root, "$root/conf", "$root/logs", "$root/temp", `
                  "$root/store", "$root/pebble" | Out-Null

          # --- fetch Pebble (native windows/amd64, no Docker, no build) ---
          Write-Host "== fetch Pebble v2.10.1 =="
          $pebbleZip = "$root/pebble/pebble.zip"
          Invoke-WebRequest `
            -Uri 'https://github.com/letsencrypt/pebble/releases/download/v2.10.1/pebble-windows-amd64.zip' `
            -OutFile $pebbleZip `
            -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 60
          Expand-Archive -Path $pebbleZip -DestinationPath "$root/pebble" -Force
          $pebbleExe = Get-ChildItem -Path "$root/pebble" -Filter 'pebble*.exe' `
            -Recurse | Select-Object -First 1
          if (-not $pebbleExe) { throw "pebble-windows-amd64.zip did not contain an exe" }

          # The release zip ships ONLY the binary -- test/certs/ is repo
          # content, not release content. The bash version gets all three PEMs
          # from inside the container image; here every one is fetched from the
          # SAME tag as the binary, which keeps the leaf and its issuer paired.
          # (Verified against v2.10.1: `openssl verify -CAfile pebble.minica.pem
          # cert.pem` is OK, and the leaf's SANs are DNS:localhost, DNS:pebble,
          # IP Address:127.0.0.1 -- the IP SAN is what lets the module validate
          # https://127.0.0.1:14000/dir without challtestsrv resolving `pebble.`)
          Write-Host "== fetch Pebble CA cert and TLS keypair (tag v2.10.1) =="
          $pebbleCertPath = "$root/pebble-cert.pem"
          $pebbleKeyPath  = "$root/pebble-key.pem"
          $pebbleRaw = 'https://raw.githubusercontent.com/letsencrypt/pebble/v2.10.1/test/certs'
          foreach ($f in @(
            @{ Uri = "$pebbleRaw/pebble.minica.pem";     Out = "$root/ca.pem" },
            @{ Uri = "$pebbleRaw/localhost/cert.pem";    Out = $pebbleCertPath },
            @{ Uri = "$pebbleRaw/localhost/key.pem";     Out = $pebbleKeyPath }
          )) {
            Invoke-WebRequest -Uri $f.Uri -OutFile $f.Out `
              -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 60
            if (-not (Test-Path $f.Out) -or (Get-Item $f.Out).Length -eq 0) {
              throw "failed to fetch $($f.Uri)"
            }
          }
          $pebbleCert = Get-Item $pebbleCertPath
          $pebbleKey  = Get-Item $pebbleKeyPath

          # tlsPort points at a closed port so tls-alpn-01 cannot be reached:
          # the VA only hits httpPort for this challenge (same intent as the
          # bash version's AC_PORT_5998).
          $pebbleConfig = @{
            pebble = @{
              listenAddress               = "0.0.0.0:$pebblePort"
              managementListenAddress     = '0.0.0.0:15000'
              certificate                 = $pebbleCert.FullName -replace '\\', '/'
              privateKey                  = $pebbleKey.FullName -replace '\\', '/'
              httpPort                    = $httpPort
              tlsPort                     = 5998
              ocspResponderURL            = ''
              externalAccountBindingRequired = $false
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Encoding ascii -Path "$root/pebble-config.json" -Value $pebbleConfig

          Write-Host "== start Pebble (VA -> http-01 at ${hostIp}:${httpPort}) =="
          $pebbleOut = "$root/pebble-stdout.log"
          $pebbleErr = "$root/pebble-stderr.log"
          # Start-Process has no -Environment parameter; set the two Pebble
          # env vars in THIS process so the child inherits them, then restore
          # afterwards so later steps see an unmodified environment.
          $prevNoSleep    = $env:PEBBLE_VA_NOSLEEP
          $prevNonceReject = $env:PEBBLE_WFE_NONCEREJECT
          $env:PEBBLE_VA_NOSLEEP = '1'
          $env:PEBBLE_WFE_NONCEREJECT = '0'
          # Foreground process on Windows too -- same trap as nginx.exe below:
          # launch detached, keep the handle, kill it in finally.
          $pebbleProc = Start-Process -FilePath $pebbleExe.FullName `
            -ArgumentList '-config', (Resolve-Path "$root/pebble-config.json").Path, `
                           '-strict' `
            -RedirectStandardOutput $pebbleOut -RedirectStandardError $pebbleErr `
            -PassThru -NoNewWindow
          $env:PEBBLE_VA_NOSLEEP = $prevNoSleep
          $env:PEBBLE_WFE_NONCEREJECT = $prevNonceReject
          Start-Sleep -Seconds 2
          if ($pebbleProc.HasExited) {
            Get-Content $pebbleOut, $pebbleErr -ErrorAction SilentlyContinue | Write-Host
            throw "pebble.exe exited immediately with $($pebbleProc.ExitCode)"
          }

          try {
            Write-Host "== wait for Pebble directory =="
            $up = $false
            foreach ($i in 1..30) {
              try {
                Invoke-WebRequest -Uri "https://${hostIp}:${pebblePort}/dir" `
                  -SkipCertificateCheck -UseBasicParsing `
                  -ConnectionTimeoutSeconds 5 -OperationTimeoutSeconds 5 |
                  Out-Null
                $up = $true; break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $up) {
              Get-Content $pebbleOut, $pebbleErr -ErrorAction SilentlyContinue | Write-Host
              throw "Pebble did not come up"
            }

            # --- config: the IP literal is the server_name; the listener
            # binds it on the VA's httpPort so the http-01 GET lands. ---
            $store = ((Resolve-Path "$root/store").Path -replace '\\', '/')
            $ca    = ((Resolve-Path "$root/ca.pem").Path -replace '\\', '/')
            $lines = @(
              'error_log logs/error.log info;',
              'events {}',
              'http {',
              '    autocert on;',
              '    autocert_contact admin@example.com;',
              "    autocert_ca https://${hostIp}:${pebblePort}/dir;",
              "    autocert_ca_trusted_certificate $ca;",
              "    autocert_store_path $store;",
              '    autocert_challenge http-01;',
              '    server {',
              "        listen $httpPort;",
              "        server_name ${hostIp};",
              '        autocert on;',
              '    }',
              '}'
            )
            Set-Content -Encoding ascii -Path "$root/conf/nginx.conf" -Value $lines

            Write-Host "== config test =="
            $prev = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $tOut = (& .\objs\nginx.exe -p $root -c conf/nginx.conf -t 2>&1 | Out-String)
            $tRc  = $LASTEXITCODE
            $ErrorActionPreference = $prev
            Write-Host $tOut
            if ($tRc -ne 0) { throw "nginx -t rejected the IPv4-issuance config" }

            Write-Host "== start: register account, run http-01 order for $hostIp =="
            # nginx does NOT daemonize on win32 -- see the HTTP-01 step above.
            $proc = Start-Process -FilePath (Resolve-Path .\objs\nginx.exe) `
                      -ArgumentList '-p', $root, '-c', 'conf/nginx.conf' `
                      -PassThru -NoNewWindow
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              if (Test-Path "$root/logs/error.log") {
                Get-Content "$root/logs/error.log" | Write-Host
              }
              throw "nginx.exe exited immediately with $($proc.ExitCode)"
            }

            try {
              $log = "$root/logs/error.log"

              $ok = $false
              foreach ($i in 1..60) {
                if ((Test-Path $log) -and
                    (Select-String -Path $log -Pattern 'autocert: authorization for .* is valid' -Quiet)) {
                  $ok = $true; break
                }
                if ((Test-Path $log) -and
                    (Select-String -Path $log `
                       -Pattern 'autocert: ACME order failed|authorization poll timed out|authorization did not become valid' `
                       -Quiet)) {
                  break
                }
                Start-Sleep -Milliseconds 500
              }
              if (Test-Path $log) {
                Write-Host "== helper log =="
                Select-String -Path $log -Pattern 'autocert' |
                  ForEach-Object { Write-Host $_.Line }
              }
              if (-not $ok) {
                Get-Content $pebbleOut, $pebbleErr -ErrorAction SilentlyContinue |
                  Select-Object -Last 40 | Write-Host
                throw "authorization did not reach valid for the IP identifier"
              }
              Write-Host "OK authorization reached valid (http-01 served at the IP literal)"

              $issued = $false
              foreach ($i in 1..60) {
                if ((Test-Path $log) -and
                    (Select-String -Path $log -SimpleMatch `
                       -Pattern 'autocert: certificate provisioned for' -Quiet)) {
                  $issued = $true; break
                }
                if ((Test-Path $log) -and
                    (Select-String -Path $log `
                       -Pattern 'autocert: (finalize failed|order poll timed out|order did not become valid|certificate download failed|ACME order failed)' `
                       -Quiet)) {
                  break
                }
                Start-Sleep -Milliseconds 500
              }
              if (-not $issued) {
                Get-Content $pebbleOut, $pebbleErr -ErrorAction SilentlyContinue |
                  Select-Object -Last 40 | Write-Host
                throw "certificate was not provisioned for the IP identifier"
              }
              Write-Host "OK certificate provisioned (finalize -> poll -> download -> store)"

              # Pebble echoes the ordered identifier back into its own log.
              # Seeing a "dns" identifier holding the dotted quad proves the
              # module sent {"type":"dns"} instead of {"type":"ip"} -- an
              # RFC 8738 violation that STILL issues a working cert, so no
              # other assertion here catches it. Native Pebble has no `docker
              # logs`; its stdout/stderr were redirected to files above.
              $pebbleLog = Get-Content $pebbleOut, $pebbleErr -ErrorAction SilentlyContinue -Raw
              if ($pebbleLog -match [regex]::Escape('"type":"dns","value":"' + $hostIp + '"')) {
                throw "module ordered the IP as a dns identifier (RFC 8738 violation)"
              }
              Write-Host "OK the IP was ordered as an 'ip' identifier, not 'dns'"

              # An IPv4 literal is stored verbatim (only IPv6 segments are
              # mangled).
              $key   = "$root/store/$hostIp/privkey.pem"
              $chain = "$root/store/$hostIp/fullchain.pem"
              if (-not (Test-Path $key))   { throw "missing $key" }
              if (-not (Test-Path $chain)) { throw "missing $chain" }
              Write-Host "OK store segment is the verbatim IPv4 literal ($hostIp)"

              # openssl.exe is not on PATH on windows-latest; use the vcpkg
              # build staged for this job's own nginx link (OPENSSL_ROOT was
              # exported to GITHUB_ENV by the "Locate OpenSSL" step above).
              $openssl = "$env:OPENSSL_ROOT\tools\openssl\openssl.exe"
              if (-not (Test-Path $openssl)) {
                $openssl = (Get-ChildItem -Path $env:OPENSSL_ROOT -Recurse -Filter 'openssl.exe' `
                              -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              }
              if (-not $openssl -or -not (Test-Path $openssl)) {
                throw "openssl.exe not found under `$env:OPENSSL_ROOT ($env:OPENSSL_ROOT)"
              }

              # The SAN must be an iPAddress, NOT a DNS name -- X509_check_host
              # never matches an iPAddress SAN, so a cert carrying
              # "DNS:127.0.0.1" would fail to serve even though it looks right
              # by eye. Assert the SAN *type* explicitly, both ways.
              $san = & $openssl x509 -in $chain -noout -ext subjectAltName 2>$null
              $sanText = $san -join "`n"
              if ($sanText -notmatch [regex]::Escape("IP Address:$hostIp")) {
                throw "leaf SAN has no iPAddress:$hostIp (got: $sanText)"
              }
              if ($sanText -match 'DNS:') {
                throw "leaf SAN carries a DNS name for an IP identifier (got: $sanText)"
              }
              Write-Host "OK leaf SAN is an iPAddress (RFC 8738), with no DNS SAN"

              $certPub = & $openssl x509 -in $chain -noout -pubkey 2>$null
              $keyPub  = & $openssl pkey -in $key -pubout 2>$null
              if (($certPub -join "`n") -ne ($keyPub -join "`n")) {
                throw "issued certificate pubkey != stored private key"
              }
              Write-Host "OK issued certificate public key matches the stored private key"

              Write-Host "full IPv4-literal issuance verified end-to-end (RFC 8738, http-01)"
            }
            finally {
              $ErrorActionPreference = 'Continue'
              & .\objs\nginx.exe -p $root -c conf/nginx.conf -s stop 2>&1 |
                Out-String | Write-Host
              if (-not $proc.WaitForExit(10000)) {
                Write-Host "nginx did not exit on -s stop; killing"
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
              Get-Process -Name nginx -ErrorAction SilentlyContinue |
                Stop-Process -Force -ErrorAction SilentlyContinue
              $ErrorActionPreference = $prev
            }
          }
          finally {
            if ($pebbleProc -and -not $pebbleProc.HasExited) {
              Stop-Process -Id $pebbleProc.Id -Force -ErrorAction SilentlyContinue
              $pebbleProc.WaitForExit(10000) | Out-Null
            }
            Get-Process -Name 'pebble*' -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

          exit 0

      - name: Upload nginx.exe
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nginx-win32-msvc
          path: nginx-${{ env.NGINX_VERSION }}/objs/nginx.exe
          retention-days: 7

      - name: Dump configure log on failure
        if: failure()
        shell: pwsh
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          foreach ($f in 'objs\autoconf.err', 'objs\Makefile') {
            if (Test-Path $f) {
              Write-Host "===== $f ====="
              Get-Content $f -Tail 100
            }
          }

  # The second win32 toolchain. Not redundant with the MSVC job: the two
  # disagree about almost everything this port touches. MinGW-w64 ships the
  # POSIX-shaped headers MSVC lacks (sys/stat.h with a real struct stat,
  # mode_t, the O_* flags), so a shim branch that satisfies cl can still be
  # wrong here, and vice versa. Building both is what stops the win32 code from
  # being quietly MSVC-only.
  #
  # MSYS2 supplies the toolchain only. It also packages OpenSSL, PCRE2 and zlib,
  # and installing them looks like the obvious shortcut, but nginx never looks:
  # auto/lib/{pcre,zlib,openssl}/conf each guard their whole probe block with
  # `if [ "$NGX_PLATFORM" != win32 ]`, so on win32 no library is auto-detected
  # for ANY compiler. A pacman-installed PCRE2 sitting in the MINGW64 prefix
  # still ends in "the HTTP rewrite module requires the PCRE library".
  #
  # So this job feeds the same pinned source tarballs the MSVC job uses through
  # --with-pcre/--with-zlib/--with-openssl and lets configure build them with
  # gcc. Same sha256 pins, same versions, one fetch step shared in spirit with
  # the MSVC half.
  mingw:
    name: MinGW-w64 x64 build
    runs-on: windows-latest
    # Longer than the MSVC job's 30: that one links a prebuilt vcpkg OpenSSL,
    # while this one compiles OpenSSL, PCRE2 and zlib from source under gcc.
    timeout-minutes: 60

    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # msystem: MINGW64 selects the mingw-w64 GCC targeting the native Win32
      # API. The MSYS toolchain in the same installation targets the msys2
      # POSIX emulation layer instead, which would build something that is not
      # a native win32 binary and would defeat the point of this job.
      # setup-msys2 caches the pacman downloads on its own (its `cache` input
      # defaults to true at this pin), so there is nothing to add here. update
      # is false, so the installed set stays pinned to this list.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            perl

      - name: Load pinned nginx version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          grep -E '^(NGINX_VERSION|NGINX_VERSION_SHA256)=' .github/versions.env >> "$GITHUB_ENV"

      - name: Fetch and verify nginx
        shell: msys2 {0}
        run: |
          set -euo pipefail
          tarball="nginx-${NGINX_VERSION}.tar.gz"
          curl -fsSL -o "$tarball" "https://nginx.org/download/${tarball}"
          echo "${NGINX_VERSION_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball"

      # Versions and digests match the MSVC job's Fetch step; OpenSSL is pinned
      # to the series vcpkg resolves there. Every archive is checked before it
      # is unpacked, same rule as the Linux fetches.
      # The compiled-OpenSSL cache key below must change when the toolchain
      # does: those are static archives, and linking them with a different gcc
      # is an ABI gamble. update:false pins the package set but the runner
      # IMAGE can still ship a newer gcc, so read the real version rather than
      # assuming it is stable.
      - name: Record the MinGW gcc version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          v=$(gcc -dumpversion)
          echo "MINGW_GCC_VERSION=$v" >> "$GITHUB_ENV"
          echo "gcc $v"

      # The three source tarballs are immutable (pinned URL + sha256), so they
      # are cached rather than re-downloaded each run. The sha256sum -c below
      # still runs on the restored copy, so a truncated or tampered cache entry
      # fails the build instead of being compiled -- caching does not weaken
      # the verification, it only skips the transfer.
      - name: Cache source tarballs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            pcre2-10.44.tar.gz
            zlib-1.3.1.tar.gz
            openssl-3.5.4.tar.gz
          key: srctars-mingw-${{ env.DEPS_KEY }}

      - name: Fetch and verify PCRE2, zlib and OpenSSL
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # -f only when absent: a cache hit means the file is already here and
          # already pinned by sha256, so re-fetching it buys nothing.
          fetch() {
            [ -f "$2" ] || curl -fsSL -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
            tar -xzf "$2"
          }
          fetch https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz \
                pcre2-10.44.tar.gz \
                86b9cb0aa3bcb7994faa88018292bc704cdbb708e785f7c74352ff6ea7d3175b
          fetch https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz \
                zlib-1.3.1.tar.gz \
                9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23
          fetch https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz \
                openssl-3.5.4.tar.gz \
                967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99

      # --crossbuild=win32 for the same reason as the MSVC job: under MSYS2
      # `uname` reports MINGW64_NT, which configure does not recognise as a
      # supported OS and bails on before testing the compiler.
      #
      # All three libraries come in as source paths because the win32 branch of
      # auto/lib/*/conf skips every probe (see the job comment). --with-pcre and
      # --with-zlib take the unpacked trees; --with-openssl builds OpenSSL with
      # the same gcc, so no staged-tree junction or timestamp fixup is needed
      # here the way it is on the MSVC side.
      #
      # The module's own config picks -lssl -lcrypto off NGX_CC_NAME=gcc, so
      # the link line is GNU-shaped end to end.
      - name: Configure
        shell: msys2 {0}
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          set -euo pipefail
          ./configure \
            --crossbuild=win32 \
            --with-cc=gcc \
            --builddir=objs \
            --prefix= \
            --conf-path=conf/nginx.conf \
            --pid-path=logs/nginx.pid \
            --http-log-path=logs/access.log \
            --error-log-path=logs/error.log \
            --sbin-path=nginx.exe \
            --http-client-body-temp-path=temp/client_body_temp \
            --http-proxy-temp-path=temp/proxy_temp \
            --http-fastcgi-temp-path=temp/fastcgi_temp \
            --with-cc-opt="-DFD_SETSIZE=1024" \
            --with-pcre="$(pwd)/../pcre2-10.44" \
            --with-zlib="$(pwd)/../zlib-1.3.1" \
            --with-openssl="$(pwd)/../openssl-3.5.4" \
            --with-http_ssl_module \
            --add-module="$(pwd)/.."

      # This is the expensive part of the MinGW lane: --with-openssl=<srcdir>
      # makes nginx COMPILE OpenSSL from source, which is most of this job's
      # ~40 minutes (the MSVC lane links vcpkg binaries instead and finishes in
      # roughly half the time).
      #
      # nginx's generated rule has the installed header as its target
      # (auto/lib/openssl/make: "$OPENSSL/.openssl/include/openssl/ssl.h:"), so
      # if the install tree is restored and newer than the makefile, make skips
      # the whole configure+build+install recipe. Cache exactly that prefix.
      #
      # The key carries the gcc version AND this file's hash, because the
      # cached artifacts are gcc-built static archives: a runner image that
      # moves to a new gcc must not link yesterday's objects, and an OpenSSL
      # version bump lands in this file. Restore is exact-match only (no
      # restore-keys) for the same reason -- a near-miss here would be an ABI
      # mismatch, not a warm start.
      - name: Cache the compiled OpenSSL
        id: ossl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openssl-3.5.4/.openssl
          key: openssl-mingw-${{ env.MINGW_GCC_VERSION }}-${{ env.DEPS_KEY }}

      # The rule is a FILE target whose prerequisite is objs/Makefile, and
      # Configure regenerates that makefile every run. actions/cache restores
      # original mtimes, so a restored ssl.h is older than the just-written
      # makefile and make would rebuild OpenSSL anyway -- the cache would look
      # like a hit and buy nothing. Touch the tree so the installed header
      # wins the timestamp comparison.
      #
      # Only on a hit: on a miss the files do not exist and the real build has
      # to run.
      - name: Mark the cached OpenSSL as up to date
        if: steps.ossl-cache.outputs.cache-hit == 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -f openssl-3.5.4/.openssl/include/openssl/ssl.h || {
            echo "cache hit but the install tree is incomplete"; exit 1; }
          find openssl-3.5.4/.openssl -exec touch {} +
          echo "restored OpenSSL install tree marked newer than the makefile"

      # Serial on purpose. nginx's generated makefile drives the OpenSSL and
      # PCRE2 sub-builds as recipe chains rather than as real dependency edges,
      # so -j races them against the targets that consume their output.
      - name: Build
        shell: msys2 {0}
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          set -euo pipefail
          make

      # Same assertion as the MSVC job, and for the same reason: a green build
      # proves nginx compiled, not that the addon was registered.
      - name: Verify the module linked in
        shell: msys2 {0}
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          set -euo pipefail
          test -f objs/nginx.exe || { echo "objs/nginx.exe was not produced"; exit 1; }
          test -f objs/addon/src/ngx_http_autocert_module.o || {
            echo "addon object missing - the addon did not compile"; exit 1; }
          grep -q 'ngx_http_autocert_module' objs/ngx_modules.c || {
            echo "ngx_http_autocert_module absent from objs/ngx_modules.c"; exit 1; }
          echo "module present in ngx_modules.c and objs/nginx.exe built"

      - name: Smoke-test the directive table
        shell: msys2 {0}
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p conf logs temp

          write_conf() {
            cat > conf/nginx.conf <<EOF
          events { worker_connections 64; }
          http {
              $1
              server {
                  listen 8099;
                  server_name localhost;
              }
          }
          EOF
          }

          # Positive: a real directive must be accepted.
          write_conf 'autocert_store_path temp/store;'
          ./objs/nginx.exe -p . -c conf/nginx.conf -t

          # Negative control: a bogus directive must be REJECTED, or the check
          # above proved nothing. `!` rather than `|| true` so an unexpected
          # zero exit fails the step.
          write_conf 'autocert_NOT_A_DIRECTIVE on;'
          if ./objs/nginx.exe -p . -c conf/nginx.conf -t 2>&1; then
            echo "negative control passed: nginx -t accepted a bogus directive"
            exit 1
          fi
          echo "directive table verified (valid accepted, bogus rejected)"

      - name: Upload nginx.exe
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nginx-win32-mingw
          path: nginx-${{ env.NGINX_VERSION }}/objs/nginx.exe
          retention-days: 7

      - name: Dump configure log on failure
        if: failure()
        shell: msys2 {0}
        working-directory: nginx-${{ env.NGINX_VERSION }}
        run: |
          for f in objs/autoconf.err objs/Makefile; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              tail -100 "$f"
            fi
          done
