# sync-sha: ae2031e3d4c185c226fa0fdd98a54f07e927d663c38f7139be4bfa1744898843
name: Fuzzing

# Fast fuzz regression — 30s/target on the JSON + HTTP + base64url ACME parsers
# (+ fuzz.dict). Called by ci.yml on every PR, and dispatchable standalone.
#
# Deep coverage (14400s/target) lives in ci-deep.yml, on the release/schedule
# path only. This member carries no `needs:`, so it runs in the first wave beside
# the ~471-494s e2e critical path and adds nothing to the merge budget. Measured
# 171s at 3 targets on run 31332902290 (the older 74s figure predates fuzz_b64).
#
# Was dispatch-only and called by nobody until step 48 (2026-08-09): its last
# run was 2026-07-11 under a `pull_request:` trigger it no longer had, leaving a
# month-stale green badge. A member reached by no caller never goes red.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Short fuzz regression — all three parser targets, 30s each ────────────
  fuzz-regression:
    name: Fuzz regression (30s/target)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","builder02","lxc"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/fuzz"

      # -max_len=32768 (libFuzzer's default is 4096). The shims carry an
      # allocation-budget oracle that abort()s when a parser's total allocation
      # count or byte total exceeds a linear bound in the input length, so a
      # superlinear blowup is only visible if the fuzzer can generate a document
      # long enough to exceed that bound. 4096 bytes is too short to leave much
      # margin. 32768 measured as the largest value with no incremental
      # throughput cost on this host: fuzz_json ~176k exec/s (~168k at the 4096
      # default), fuzz_b64 ~460k (~297k), fuzz_http ~35k -- and fuzz_http sits at
      # 34-36k exec/s anywhere from 8192 to 32768, so the step down from default
      # is paid at any raise and buying the extra length is free. The 30s lane
      # still gets ~1M+ executions per target.
      - name: Run each target 30s
        run: |
          set -euo pipefail
          # build.sh puts only the BINARIES in $GITHUB_WORKSPACE/fuzz (the
          # OSS-Fuzz $OUT convention); the corpora and fuzz.dict stay tracked in
          # ci/fuzz. Resolve each from where it actually lives -- a bare
          # `cd fuzz` finds the binaries but no corpus, which is what made this
          # workflow fail the moment it was reconnected to CI (step 48).
          BIN="$GITHUB_WORKSPACE/fuzz"
          DATA="$GITHUB_WORKSPACE/ci/fuzz"
          cd "$DATA"
          for t in json:corpus http:corpus_http b64:corpus_b64; do
            name=${t%%:*}; corp=${t##*:}
            [ -d "$DATA/${corp}" ] || { echo "❌ corpus $DATA/${corp} missing"; exit 1; }
            echo "== fuzz_${name} (30s) =="
            set +e
            "$BIN/fuzz_${name}" \
              -max_total_time=30 \
              -max_len=32768 \
              -dict="$DATA/fuzz.dict" \
              -print_final_stats=1 \
              -artifact_prefix="crash-${name}-" \
              "$DATA/${corp}/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ fuzz_${name} crash (exit $rc)"; exit 1; }
            echo "✓ no crashes in fuzz_${name} 30s"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-fast-crashes
          path: |
            ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 14
