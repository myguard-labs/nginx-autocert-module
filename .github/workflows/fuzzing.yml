# sync-sha: d2d1d2af5b0b9c7f6d58c65aaf3b77ac620346137b4f28960aff4787d13fa180
name: Fuzzing

# Manual fast fuzz regression — 30s/target on the JSON + HTTP ACME parsers
# (+ fuzz.dict). PR/release coverage lives in ci-deep.yml so normal pushes do
# not steal self-hosted runner lanes from Build & Test.
#
# Action pins (keep in sync with build-test.yml header):
# actions/checkout@v5        -> 93cb6efe18208431cddfb8368fd83d5badbf9bfd
# actions/upload-artifact@v5 -> 330a01c490aca151604b8cf639adc76d48f6c5d4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NGINX_VERSION: ""

on:
  workflow_dispatch: {}

concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Short fuzz regression — both parser targets, 30s each ─────────────────
  fuzz-regression:
    name: Fuzz regression (30s/target)
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 30
    steps:
      - name: Checkout module
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build fuzz targets
        run: bash ci/fuzz/build.sh "$GITHUB_WORKSPACE/fuzz"

      - name: Run each target 30s
        run: |
          set -euo pipefail
          cd fuzz
          for t in json:corpus http:corpus_http; do
            name=${t%%:*}; corp=${t##*:}
            echo "== fuzz_${name} (30s) =="
            set +e
            "./fuzz_${name}" \
              -max_total_time=30 \
              -dict=fuzz.dict \
              -print_final_stats=1 \
              -artifact_prefix="crash-${name}-" \
              "${corp}/"
            rc=$?
            set -e
            [ $rc -eq 0 ] || { echo "❌ fuzz_${name} crash (exit $rc)"; exit 1; }
            echo "✓ no crashes in fuzz_${name} 30s"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-fast-crashes
          path: |
            ${{ github.workspace }}/ci/fuzz/crash-*
          retention-days: 14
